name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    name: Lint, types, tests, build
    # Version figée, pas ubuntu-latest (Ubuntu 26 dès le 19/10/2026) : le client Postgres vient du dépôt PGDG
    # nommé d'après la version (lsb_release -cs), qui pourrait ne pas encore exister pour une Ubuntu neuve.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: gerimmo-ci-local
          POSTGRES_DB: gerimmo_ci_sql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerimmo_ci_sql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: cle-locale
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SUPABASE_DB_URL: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_sql
      SUPALOCAL_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_sql_api
      GERIMMO_PILOTE_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_lottrois
      GERIMMO_HISTORIQUE_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_historique
      POSTGREST_REEL_URL: http://127.0.0.1:53901
      POSTGREST_REEL_JWT_SECRET: gerimmo-revue-local-fictif-sans-production
      GERIMMO_AUTH_REEL_URL: http://127.0.0.1:55519
      GERIMMO_AUTH_REEL_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_auth_reprise
      NODE_OPTIONS: --max-old-space-size=4096
      GERIMMO_ARTISAN_CLIENTS_LOCAUX: "1"
      GERIMMO_ARTISAN_REGLEMENTS_LOCAUX: "1"
      PLANNING_CONFLITS_CONCURRENCE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tester les contrôles de publication sans connexion externe
        run: node --test scripts/deploiement/conditionner-migration.test.mjs scripts/deploiement/controle.test.mjs scripts/deploiement/verifier-environnement.test.mjs scripts/surveillance/disponibilite.test.mjs scripts/surveillance/sauvegarde.test.mjs scripts/atelier/controle.test.mjs scripts/sauvegarde/fichiers.test.mjs
      - run: npm ci
      # 03/10 (décision du porteur) : seules les dépendances livrées comptent.
      # Les outils de développement (CLI shadcn, greffon ESLint) tirent des
      # avis sans version corrigée (braces, GHSA-vfj7-8cjw-p6xm) qui
      # bloquaient la CI sans rien changer au code en production.
      - name: Vérifier les vulnérabilités connues des dépendances livrées
        run: npm audit --audit-level=high --omit=dev
      # L'exercice de restauration (tests/exercice-restauration.test.ts) lance
      # un vrai pg_dump : le client doit être de la version du serveur (18).
      - name: Client PostgreSQL 18 (même version que le serveur)
        run: |
          set -euo pipefail
          # Garder les miroirs disponibles : un miroir qui sert InRelease peut
          # devenir inaccessible pendant le téléchargement des navigateurs.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            miroirs=$(mktemp)
            for miroir in https://archive.ubuntu.com/ubuntu https://mirror.math.princeton.edu/pub/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
              disponible=1
              for suite in noble noble-updates noble-backports noble-security; do
                curl --fail --silent --show-error --max-time 10 -o /dev/null "$miroir/dists/$suite/InRelease" || { disponible=0; break; }
              done
              if [ "$disponible" = 1 ]; then
                echo "$miroir" >> "$miroirs"
              fi
            done
            test -s "$miroirs"
            sudo install -m 0644 "$miroirs" /etc/apt/apt-mirrors.txt
          fi
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/85-gerimmo-retries >/dev/null
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update --error-on=any -qq
          sudo apt-get install -y -qq postgresql-client-18
          # pg_wrapper choisit sa version commande par commande (pg_dump 18,
          # pg_restore 16) : les binaires 18 passent en tête du PATH.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version
      - name: Préparer les bases de test isolées
        run: |
          node e2e/local/preparer-ci.mjs
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create database gerimmo_ci_invitation_api template gerimmo_ci_sql"
          node scripts/deploiement/preparer-pilote-local.mjs
          node --input-type=module -e 'import {Client} from "pg";const c=new Client({connectionString:process.env.SUPABASE_DB_URL});await c.connect();await c.query("create database gerimmo_ci_historique");await c.end();'
          SUPABASE_DB_URL="$GERIMMO_HISTORIQUE_DB" GERIMMO_BASE_AVANT_LOTS=1 node e2e/local/preparer-ci.mjs
      - name: Vérifier les jointures et l'isolation avec 300 lots fictifs
        env:
          GERIMMO_CHARGE_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_charge_automatique
        run: |
          node --input-type=module -e 'import {Client} from "pg"; const c=new Client({connectionString:process.env.SUPABASE_DB_URL}); await c.connect(); await c.query("create database gerimmo_ci_charge_automatique template gerimmo_ci_sql"); await c.end();'
          node scripts/recette/charge-300-lots.mjs
      - name: Vérifier les accès au portail après un changement de rôle sur PostgREST 14.5
        run: |
          set -euo pipefail
          export POSTGREST_REEL_JWT_SECRET="$(openssl rand -hex 32)"
          export POSTGREST_REEL_URL=http://127.0.0.1:53923
          docker run -d --name portail-g11 --network host -e PGRST_DB_URI="$SUPABASE_DB_URL" -e PGRST_DB_PRE_REQUEST=gerimmo_session_interne.verifier_session_api -e PGRST_DB_ANON_ROLE=anon -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=53923 -e PGRST_JWT_SECRET="$POSTGREST_REEL_JWT_SECRET" postgrest/postgrest:v14.5
          trap 'docker stop portail-g11 >/dev/null' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-max-time 60 "$POSTGREST_REEL_URL/" -o /dev/null
          node e2e/local/verifier-portail-postgrest.mjs
      - name: Démarrer l’API de test locale
        run: |
          node e2e/local/serveur-supabase-local.mjs > /tmp/gerimmo-api.log 2>&1 &
          echo $! > /tmp/gerimmo-api.pid
          for tentative in {1..30}; do
            if curl --silent --fail http://127.0.0.1:54321/health > /dev/null; then
              # Clé purement fictive du banc : même signature que l'émulateur,
              # transmise directement à GitHub Env, jamais extraite d'un journal.
              node -e 'const fs=require("node:fs"),c=require("node:crypto");const b=v=>Buffer.from(JSON.stringify(v)).toString("base64url");const h=b({alg:"HS256",typ:"JWT"})+"."+b({role:"service_role",exp:Math.floor(Date.now()/1000)+7200});const t=h+"."+c.createHmac("sha256","gerimmo-local-secret").update(h).digest("base64url");fs.appendFileSync(process.env.GITHUB_ENV,"SUPABASE_SERVICE_ROLE_KEY="+t+"\n");'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gerimmo-api.log
          exit 1
      - name: Vérifier PostgREST 14.5 sur la base fictive migrée
        run: |
          docker run -d --name postgrest-revue --network host \
            -e PGRST_DB_URI="$SUPALOCAL_DB" -e PGRST_DB_PRE_REQUEST=gerimmo_session_interne.verifier_session_api -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=53901 \
            -e PGRST_JWT_SECRET="$POSTGREST_REEL_JWT_SECRET" postgrest/postgrest:v14.5
          curl --fail --silent --retry 20 --retry-connrefused "$POSTGREST_REEL_URL/" -o /dev/null
          npx vitest run tests/auto-relation-documents-postgrest.test.ts
      - name: Vérifier deux activations concurrentes sur une base dédiée
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c 'create database gerimmo_ci_contrats_api template gerimmo_ci_sql'
          export SUPALOCAL_DB="${SUPABASE_DB_URL%/*}/gerimmo_ci_contrats_api"
          export POSTGREST_REEL_URL=http://127.0.0.1:53902
          docker run -d --name postgrest-contrats --network host \
            -e PGRST_DB_URI="$SUPALOCAL_DB" -e PGRST_DB_PRE_REQUEST=gerimmo_session_interne.verifier_session_api -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=53902 \
            -e PGRST_JWT_SECRET="$POSTGREST_REEL_JWT_SECRET" postgrest/postgrest:v14.5
          curl --fail --silent --retry 20 --retry-connrefused "$POSTGREST_REEL_URL/" -o /dev/null
          export STORAGE_CONTRATS_URL=http://127.0.0.1:54389
          SUPALOCAL_PORT=54389 SUPALOCAL_STORAGE="$RUNNER_TEMP/stockage-contrats" node e2e/local/serveur-supabase-local.mjs > "$RUNNER_TEMP/stockage-contrats.log" 2>&1 &
          stockage_pid=$!
          trap 'kill "$stockage_pid"' EXIT
          curl --fail --silent --retry 20 --retry-connrefused "$STORAGE_CONTRATS_URL/health" -o /dev/null
          node scripts/recette/exclusivite-contrat.mjs
      - name: Démarrer Auth isolé sans messagerie externe
        run: |
          node --input-type=module -e 'import {Client} from "pg"; const c=new Client({connectionString:process.env.SUPABASE_DB_URL});await c.connect();await c.query("create database gerimmo_ci_auth_reprise");await c.query("alter database gerimmo_ci_auth_reprise set search_path=auth,public");await c.end();const a=new Client({connectionString:process.env.GERIMMO_AUTH_REEL_DB});await a.connect();await a.query("create schema auth; create extension if not exists pgcrypto");await a.end();'
          docker run -d --name gerimmo-auth-test --network host \
            -e DATABASE_URL="$GERIMMO_AUTH_REEL_DB" -e GOTRUE_DB_DRIVER=postgres -e DB_NAMESPACE=auth \
            -e API_EXTERNAL_URL=http://127.0.0.1:55519 -e PORT=55519 -e GOTRUE_API_HOST=127.0.0.1 \
            -e GOTRUE_SITE_URL=http://localhost:3100 -e GOTRUE_JWT_SECRET=gerimmo-auth-local-fictif-sans-production \
            -e GOTRUE_JWT_ADMIN_ROLES=service_role -e GOTRUE_MAILER_AUTOCONFIRM=false \
            -e GOTRUE_SMTP_HOST=127.0.0.1 -e GOTRUE_SMTP_PORT=1 -e GOTRUE_SMTP_ADMIN_EMAIL=auth@example.invalid \
            supabase/gotrue:v2.197.0
          for tentative in {1..60}; do
            if curl --silent --fail http://127.0.0.1:55519/health > /dev/null; then
              node -e 'const fs=require("node:fs"),c=require("node:crypto");const b=v=>Buffer.from(JSON.stringify(v)).toString("base64url");const h=b({alg:"HS256",typ:"JWT"})+"."+b({role:"service_role",exp:Math.floor(Date.now()/1000)+7200});fs.appendFileSync(process.env.GITHUB_ENV,"GERIMMO_AUTH_REEL_SERVICE="+h+"."+c.createHmac("sha256","gerimmo-auth-local-fictif-sans-production").update(h).digest("base64url")+"\n");'
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 30 gerimmo-auth-test
          exit 1
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - name: Installer Chromium et WebKit pour les PDF et les essais interactifs
        run: npx playwright install --with-deps chromium webkit
      - name: Tester la logique et produire les documents PDF
        run: |
          export GERIMMO_CHROME="$(node -p "require('@playwright/test').chromium.executablePath()")"
          export GERIMMO_CATALOGUE_PDF_DIR="$RUNNER_TEMP/gerimmo-pdfs"
          export GERIMMO_TEST_PDF=1
          export SIGNATURE_TEST_API_URL=http://127.0.0.1:54321
          export SIGNATURE_TEST_DB_URL="$SUPALOCAL_DB"
          npm test -- --maxWorkers=1
      - name: Préparer les parcours navigateur isolés
        run: |
          node e2e/local/seed-parcours.mjs
          npm run e2e:matrice
      - name: Tester les parcours par profil et auditer les écrans mobiles
        env:
          E2E_CI: "1"
          E2E_USE_BUILD: "1"
          # Même hôte que le site : Chromium accepte les cookies Secure du build local sur localhost.
          E2E_BASE_URL: http://localhost:3100
          E2E_INVITATION_ISOLEE: "0"
        run: npm run test:e2e
      - name: Vérifier les envois admis avec boîte fictive et réseau extérieur bloqué
        env:
          E2E_CI: "1"
          E2E_USE_BUILD: "1"
          E2E_BASE_URL: http://localhost:3100
        run: npx playwright test --config e2e/playwright.courriels.config.ts
      - name: Vérifier les parcours essentiels sur WebKit mobile
        env:
          E2E_CI: "1"
          E2E_USE_BUILD: "1"
          E2E_BASE_URL: http://localhost:3100
        run: npm run test:e2e:webkit
      - name: Vérifier le dépôt et l’activation du bail sur le véritable PostgREST
        env:
          E2E_CI: "1"
          E2E_USE_BUILD: "1"
          E2E_BASE_URL: http://localhost:3100
        run: |
          kill "$(cat /tmp/gerimmo-api.pid)"
          for attente in {1..20}; do
            if ! curl -fsS "$NEXT_PUBLIC_SUPABASE_URL/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          SUPALOCAL_RELAIS_POSTGREST="$POSTGREST_REEL_URL" node e2e/local/serveur-supabase-local.mjs > /tmp/gerimmo-api-reelle.log 2>&1 &
          relais=$!
          echo "$relais" > /tmp/gerimmo-relais.pid
          curl --fail --silent --retry 20 --retry-connrefused "$NEXT_PUBLIC_SUPABASE_URL/health"
          kill -0 "$relais"
          npx playwright test --config e2e/playwright.revue-lot.config.ts depot-bail-signe-papier.spec.ts detention-confirmation.spec.ts attestations-refus.spec.ts
      - name: Vérifier l’invitation artisan dans une base jetable indépendante
        env:
          E2E_CI: "1"
          E2E_USE_BUILD: "1"
          E2E_BASE_URL: http://localhost:3100
          SUPALOCAL_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_invitation_api
        run: |
          kill "$(cat /tmp/gerimmo-relais.pid)"
          psql "$SUPALOCAL_DB" -v ON_ERROR_STOP=1 -f supabase/seed.sql >/dev/null
          SUPALOCAL_STORAGE="$RUNNER_TEMP/stockage-invitation" node e2e/local/serveur-supabase-local.mjs >/tmp/gerimmo-api-invitation.log 2>&1 &
          api=$!
          trap 'kill "$api" || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused "$NEXT_PUBLIC_SUPABASE_URL/health"
          kill -0 "$api"
          npx playwright test --config e2e/playwright.config.ts invitation-artisan.spec.ts --workers=1
      - name: Conserver les résultats du navigateur
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: essais-interactifs
          path: |
            app/e2e/.results
            app/e2e/.results-courriels
            app/e2e/.results-webkit
            app/e2e/.audit
            app/tmp/charge
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Conserver les épreuves PDF de recette
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epreuves-pdf
          path: |
            ${{ runner.temp }}/gerimmo-pdfs
            /tmp/gerimmo-contrats-individuels
            /tmp/gerimmo-recette-colocation
            app/tmp/pdfs
          if-no-files-found: ignore
