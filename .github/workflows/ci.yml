name: CI


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: gerimmo-ci-local
          POSTGRES_DB: gerimmo_ci_sql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerimmo_ci_sql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: cle-locale
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SUPABASE_DB_URL: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_sql
      SUPALOCAL_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_sql_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
