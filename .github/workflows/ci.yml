name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    name: Lint, types, tests, build
    # Version figée, pas ubuntu-latest (Ubuntu 26 dès le 19/10/2026) : le client Postgres vient du dépôt PGDG
    # nommé d'après la version (lsb_release -cs), qui pourrait ne pas encore exister pour une Ubuntu neuve.
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Même version majeure que le serveur de production (17 : voir sauvegarde.yml, pg_dump « même version que le
        # serveur »), que restauration-sauvegarde.yml et que stripe-bac-a-sable.yml (audit final du 27/10, COD-11) : une
        # fonction ou un comportement du planificateur présent en 18 et absent en 17 passerait la CI et casserait en
        # production. tests/postgres-versions-chantiers.test.ts garde l'alignement.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gerimmo-ci-local
          POSTGRES_DB: gerimmo_ci_sql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerimmo_ci_sql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: cle-locale
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SUPABASE_DB_URL: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_sql
      SUPALOCAL_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_sql_api
      GERIMMO_ARTISAN_CLIENTS_LOCAUX: "1"
      GERIMMO_ARTISAN_REGLEMENTS_LOCAUX: "1"
      PLANNING_CONFLITS_CONCURRENCE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tester les contrôles de publication sans connexion externe
        run: node --test scripts/deploiement/controle.test.mjs scripts/deploiement/verifier-environnement.test.mjs scripts/surveillance/disponibilite.test.mjs scripts/surveillance/sauvegarde.test.mjs scripts/atelier/controle.test.mjs scripts/sauvegarde/fichiers.test.mjs
      - run: npm ci
      # 03/10 (décision du porteur) : seules les dépendances livrées comptent.
      # Les outils de développement (CLI shadcn, greffon ESLint) tirent des
      # avis sans version corrigée (braces, GHSA-vfj7-8cjw-p6xm) qui
      # bloquaient la CI sans rien changer au code en production.
      - name: Vérifier les vulnérabilités connues des dépendances livrées
        run: npm audit --audit-level=high --omit=dev
      # Audit final du 27/10 (COD-13) : les outils de développement n'étaient jamais audités (six avis restés
      # inaperçus, dont vitest et body-parser). Avertissement seulement, la décision du 03/10 tient : l'étape
      # signale un avis modéré ou plus sans bloquer la CI.
      - name: Signaler les vulnérabilités des outils de développement (avertissement)
        continue-on-error: true
        run: npm audit --audit-level=moderate
      # L'exercice de restauration (tests/exercice-restauration.test.ts) lance
      # un vrai pg_dump : le client doit être de la version du serveur (17).
      - name: Client PostgreSQL 17 (même version que le serveur)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # pg_wrapper choisit sa version commande par commande (pg_dump 17,
          # pg_restore 16) : les binaires 17 passent en tête du PATH.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Préparer les bases de test isolées
        run: node e2e/local/preparer-ci.mjs
      - name: Vérifier les jointures et l'isolation avec 300 lots fictifs
        env:
          GERIMMO_CHARGE_DB: postgres://postgres:gerimmo-ci-local@127.0.0.1:5432/gerimmo_ci_charge_automatique
        run: |
          node --input-type=module -e 'import {Client} from "pg"; const c=new Client({connectionString:process.env.SUPABASE_DB_URL}); await c.connect(); await c.query("create database gerimmo_ci_charge_automatique template gerimmo_ci_sql"); await c.end();'
          node scripts/recette/charge-300-lots.mjs
      - name: Démarrer l’API de test locale
        run: |
          node e2e/local/serveur-supabase-local.mjs > /tmp/gerimmo-api.log 2>&1 &
          for tentative in {1..30}; do
            if curl --silent --fail http://127.0.0.1:54321/health > /dev/null; then
              # La clé de service du banc (liens de mot de passe et inscription,
              # 30/09) : l'émulateur l'affiche au démarrage, les étapes suivantes
              # la reçoivent.
              grep '^SUPABASE_SERVICE_ROLE_KEY=' /tmp/gerimmo-api.log >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gerimmo-api.log
          exit 1
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - name: Installer Chromium et WebKit pour les PDF et les essais interactifs
        run: npx playwright install --with-deps chromium webkit
      - name: Tester la logique et produire les documents PDF
        run: |
          export GERIMMO_CHROME="$(node -p "require('@playwright/test').chromium.executablePath()")"
          export GERIMMO_CATALOGUE_PDF_DIR="$RUNNER_TEMP/gerimmo-pdfs"
          export GERIMMO_TEST_PDF=1
          export SIGNATURE_TEST_API_URL=http://127.0.0.1:54321
          export SIGNATURE_TEST_DB_URL="$SUPALOCAL_DB"
          npm test -- --maxWorkers=1
      - name: Préparer les parcours navigateur isolés
        run: |
          node e2e/local/seed-parcours.mjs
          npm run e2e:matrice
      - name: Tester les parcours par profil et auditer les écrans mobiles
        env:
          E2E_CI: "1"
          E2E_USE_BUILD: "1"
          # Même hôte que le site : Chromium accepte les cookies Secure du build local sur localhost.
          E2E_BASE_URL: http://localhost:3100
        run: npm run test:e2e
      - name: Vérifier les parcours essentiels sur WebKit mobile
        env:
          E2E_CI: "1"
          E2E_USE_BUILD: "1"
          E2E_BASE_URL: http://localhost:3100
        run: npm run test:e2e:webkit
      - name: Conserver les résultats du navigateur
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: essais-interactifs
          path: |
            app/e2e/.results
            app/e2e/.results-webkit
            app/e2e/.audit
            app/tmp/charge
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Conserver les épreuves PDF de recette
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epreuves-pdf
          path: |
            ${{ runner.temp }}/gerimmo-pdfs
            /tmp/gerimmo-contrats-individuels
            /tmp/gerimmo-recette-colocation
            app/tmp/pdfs
          if-no-files-found: ignore
