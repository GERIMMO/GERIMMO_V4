name: Disponibilité publique Gerimmo

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: disponibilite-publique
  cancel-in-progress: false

jobs:
  verifier:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Vérifier le site et sa connexion à la base, sans session
        env:
          GERIMMO_BILAN_DISPONIBILITE: ${{ runner.temp }}/disponibilite.json
        run: node app/scripts/surveillance/disponibilite.mjs
      - name: Conserver le bilan sans données personnelles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disponibilite-publique
          path: ${{ runner.temp }}/disponibilite.json
          if-no-files-found: warn
          retention-days: 7
      - name: Contrôler la fraîcheur de la sauvegarde indépendamment de Gerimmo
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GERIMMO_BILAN_SAUVEGARDE: ${{ runner.temp }}/sauvegarde.json
        run: node app/scripts/surveillance/sauvegarde.mjs
      - name: Conserver le contrôle de sauvegarde
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controle-sauvegarde
          path: ${{ runner.temp }}/sauvegarde.json
          if-no-files-found: error
          retention-days: 7
  signaler:
    needs: verifier
    if: failure() && github.ref == 'refs/heads/main' && needs.verifier.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    timeout-minutes: 2
    steps:
      - name: Ouvrir un seul incident après deux contrôles planifiés en échec
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous=$(gh api "repos/$GH_REPO/actions/workflows/disponibilite.yml/runs?branch=main&event=schedule&per_page=10" --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID)] | first | .conclusion")
          if [[ "$previous" != "failure" ]]; then exit 0; fi
          title="Disponibilité Gerimmo : deux contrôles en échec"
          existing=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" --jq '.[] | select(.title == "Disponibilité Gerimmo : deux contrôles en échec" and (has("pull_request") | not)) | .number')
          if [[ -n "$existing" ]]; then exit 0; fi
          gh issue create --repo "$GH_REPO" --title "$title" --body "La surveillance a échoué à deux reprises. Le rapport de cette exécution détaille les contrôles du site, de la base et de la sauvegarde : $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID. Identifier le contrôle en échec avant toute reprise. Clore après vérification du rétablissement."
