# Appliquer les migrations à la base de production, depuis les FICHIERS du dépôt.
#
# POURQUOI CE CHANTIER EXISTE. Les migrations étaient jusqu'ici passées à la
# main, en recopiant leur contenu dans un outil. Ça marche pour vingt lignes ;
# pas pour un module de 151 Ko, où une dérive d'un caractère est silencieuse et
# corrompt la base. Ici, c'est GitHub qui lit les fichiers — personne ne les
# retape, donc personne ne les abîme.
#
# DÉCLENCHEMENT MANUEL, ET SEULEMENT MANUEL. Une migration n'est pas un
# déploiement : elle change la forme des données, et l'ordre par rapport à la
# mise en ligne du code compte. On la lance quand on a décidé de la lancer.
#
# LE POOLER, PAS LA CONNEXION DIRECTE. `db.<ref>.supabase.co` ne répond qu'en
# IPv6 ; les machines de GitHub n'ont que de l'IPv4. Le pooler en mode session
# (port 5432) accepte le DDL, contrairement au mode transaction (6543).
#
# LA LISTE EST EXPLICITE, ET CE N'EST PAS UNE PARESSE. On pourrait croire qu'il
# suffit d'appliquer « tout fichier dont la version manque à l'historique ».
# C'est faux ICI : les fichiers du dépôt ont été renommés au fil du temps et
# leurs horodatages ne correspondent plus à ceux enregistrés en base. Exemple
# constaté le 11/09 : le dépôt porte 20260911124500_restitution_rearrete…,
# la base a enregistré la même migration sous 20260911014814. Une détection
# automatique la croirait absente et la REJOUERAIT. On nomme donc ce qu'on
# applique — le chantier affiche l'historique pour aider à choisir.
#
# SAUVEGARDE D'ABORD (19/10 ; protocole § 6, étapes 5 puis 6). « simulation » décoché : l'application est
# REFUSÉE si aucune « Sauvegarde quotidienne » n'a RÉUSSI depuis SAUVEGARDE_MAX_MINUTES (90). La preuve se lit
# dans la base elle-même, par la même connexion psql : la ligne `public.tech_log` (evenement = 'tache_sauvegarde',
# sans auteur, echecs = 0) que sauvegarde.yml écrit en fin de passage réussi (étape « Consigner le passage dans
# Gerimmo »). Aucune entrée de contournement : si la garde refuse, lancer la sauvegarde à la demande, attendre son
# succès, relancer. Le 18/10, deux des trois applications réelles (3 h 10 et 6 h 51 après la dernière sauvegarde)
# auraient été refusées.
#
# CI VERTE D'ABORD (23/10 ; protocole § 6, étape 4). « simulation » décoché : l'application est REFUSÉE si le
# DERNIER passage du chantier « CI » (`ci.yml`, « Lint, types, tests, build ») sur la révision exacte lancée
# (`github.sha`) n'est pas terminé et réussi. Le 22/10, une application réelle est partie de ed97d12 pendant que la
# CI de ce SHA tournait, puis échouait (audit du 23/10). Lecture par l'API GitHub avec le jeton du chantier
# (`actions: read`). La simulation reste permise sans CI verte. Limite : GitHub lit ce fichier sur la branche
# lancée ; une branche qui ne porte pas cette garde ne l'applique pas.
#
# ÉQUIVALENCES CONNUES — fichier du dépôt → version enregistrée en base (ne JAMAIS nommer ces fichiers ici ;
# relevé en lecture seule du 19/10) :
#   20260911124500_restitution_rearrete_sous_verrou.sql → 20260911014814  (fichier renommé le 11/09 ; son texte a
#       changé depuis : 6 140 octets au dépôt contre 3 859 enregistrés (3 808 caractères, sans saut de ligne final) —
#       seule cette liste le signale)
#   20261017180829_supervision_finances.sql             → 20261018071151  (appliquée HORS chantier le 18/10, outil MCP)
#   20261018061548_supervision_complete.sql             → 20261018071200  (idem)
#   20261018071556_supervision_index_relations.sql      → 20261018071811  (idem)
# Pour les trois du 18/10, le texte enregistré en base (`statements`) est celui du fichier, octet pour octet
# (md5 comparés le 19/10) : la garde par empreinte de l'étape « Appliquer » les refuse d'elle-même en nommant
# le fichier et la version. Cette liste sert à l'humain qui s'apprête à nommer un fichier.

name: Migrations Supabase

on:
  workflow_dispatch:
    inputs:
      fichiers:
        description: >-
          Fichiers à appliquer, séparés par des espaces, DANS L'ORDRE. Noms
          seuls (pas de chemin). Obligatoire — voir le commentaire en tête.
        required: true
      simulation:
        description: "Simulation : jouer puis TOUT annuler (rien n'est conservé)"
        type: boolean
        default: true

# Lecture seule du dépôt : actions/checkout n'a besoin de rien d'autre, et la base se joint par son propre secret.
# `actions: read` : la garde « CI verte » lit les passages du chantier CI sur la révision lancée, rien de plus.
permissions:
  contents: read
  actions: read

concurrency:
  group: migrations-production
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # CI VERTE D'ABORD (protocole § 6, étape 4 ; audit du 23/10). Une application réelle n'est acceptée que si le
      # DERNIER passage du chantier « CI » (`ci.yml`) sur la révision exacte lancée (`github.sha`) est terminé et
      # réussi : ni en cours, ni en échec, ni annulé, ni absent. Seuls les passages dont `head_sha` est cette révision
      # comptent. Le plus récent est celui dont la DERNIÈRE TENTATIVE a démarré en dernier (`run_started_at`, à défaut
      # `created_at`) : une relance (« Re-run jobs ») garde l'identifiant et le `created_at` du passage d'origine, et le
      # tri par date de création ignorait la relance d'un passage plus ancien (relecture adverse du 23/10). Et un passage
      # de la révision encore en file ou en cours, quel qu'il soit, refuse : une CI qui tourne n'a encore rien prouvé.
      # Une API muette ou une réponse illisible refuse aussi. En simulation : affiché, jamais bloquant. Jeton du
      # chantier (`actions: read`), aucun secret de plus.
      - name: Garde — CI verte sur la révision exacte
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SIMULATION: ${{ inputs.simulation }}
        run: |
          set -euo pipefail
          ETAT=illisible; DETAIL=""
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            DETAIL="révision illisible"
          elif ! REPONSE="$(curl -fsS --max-time 20 \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${DEPOT}/actions/workflows/ci.yml/runs?head_sha=${REVISION}&per_page=100")"; then
            DETAIL="l'API GitHub n'a pas répondu"
          elif ! LIGNE="$(printf '%s' "$REPONSE" | jq -er --arg sha "$REVISION" '
                [.workflow_runs[] | select(.head_sha == $sha)]
                | sort_by([(.run_started_at // .created_at), (.run_attempt // 1), .id])
                | ((map(select(.status != "completed")) | last) // last)
                | if . == null then "absent|aucun passage de la CI sur cette révision"
                  else "\(.status)/\(.conclusion // "-")|passage \(.id)\(if (.run_attempt // 1) > 1 then " (tentative \(.run_attempt))" else "" end) du \(.run_started_at // .created_at) : \(.html_url)" end')"; then
            DETAIL="réponse de l'API GitHub illisible"
          else
            ETAT="${LIGNE%%|*}"; DETAIL="${LIGNE#*|}"
          fi
          echo "— CI « Lint, types, tests, build » sur ${REVISION} : ${ETAT} (${DETAIL})"
          if [ "$ETAT" = "completed/success" ]; then exit 0; fi
          if [ "$SIMULATION" != "true" ]; then
            echo "::error title=Application refusée::la CI n'est pas verte sur la révision lancée (${ETAT})."
            echo "✗ Application refusée : le dernier passage de la CI sur ${REVISION} n'est pas réussi (${ETAT})." >&2
            echo "  Attendre la fin de la CI de cette révision exacte, ou la relancer (Actions → « CI » → Run workflow, même branche) ; relancer ce chantier une fois la CI verte." >&2
            exit 1
          fi
          echo "  simulation : rien n'est bloqué ici, mais l'application réelle serait refusée en l'état."

      - name: Client PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # SAUVEGARDE D'ABORD (protocole § 6, étapes 5 puis 6). Une application réelle n'est acceptée que si une
      # « Sauvegarde quotidienne » a RÉUSSI depuis moins de SAUVEGARDE_MAX_MINUTES. La preuve se lit dans la base
      # elle-même : la ligne `tech_log` (evenement = 'tache_sauvegarde', sans auteur, echecs = 0) que sauvegarde.yml
      # écrit en fin de passage réussi (étape « Consigner le passage dans Gerimmo »). Même connexion psql que
      # l'application, aucun droit GitHub supplémentaire. En simulation : affiché, jamais bloquant. La sortie ne
      # contient qu'un nombre de minutes et un préfixe daté.
      - name: Garde — une sauvegarde réussie récente
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: rddlxunppddzpsaatdaz
          REGION: eu-west-3
          SIMULATION: ${{ inputs.simulation }}
          SAUVEGARDE_MAX_MINUTES: "90"
        run: |
          set -euo pipefail
          URL="postgresql://postgres.${REF}@aws-0-${REGION}.pooler.supabase.com:5432/postgres"
          LIGNE="$(psql "$URL" -v ON_ERROR_STOP=1 -At -f app/scripts/sauvegarde/age-derniere-sauvegarde.sql)"
          AGE="${LIGNE%%|*}"; PREFIXE="${LIGNE#*|}"
          case "$AGE" in ''|*[!0-9-]*) echo "✗ âge de la dernière sauvegarde illisible : « $LIGNE »" >&2; exit 1;; esac
          if [ "$AGE" -lt 0 ]; then
            echo "— aucune sauvegarde réussie consignée dans tech_log"
          else
            echo "— dernière sauvegarde réussie : il y a $AGE min (préfixe $PREFIXE) ; seuil ${SAUVEGARDE_MAX_MINUTES} min"
          fi
          RECENTE=oui
          if [ "$AGE" -lt 0 ] || [ "$AGE" -gt "$SAUVEGARDE_MAX_MINUTES" ]; then RECENTE=non; fi
          if [ "$SIMULATION" != "true" ] && [ "$RECENTE" = non ]; then
            echo "✗ Application refusée : aucune « Sauvegarde quotidienne » réussie depuis ${SAUVEGARDE_MAX_MINUTES} min." >&2
            echo "  Actions → « Sauvegarde quotidienne » → Run workflow (branche main) ; attendre son succès ; relancer ce chantier." >&2
            exit 1
          fi
          if [ "$RECENTE" = non ]; then
            echo "  simulation : rien n'est bloqué ici, mais l'application réelle serait refusée en l'état."
          fi

      - name: Appliquer
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: rddlxunppddzpsaatdaz
          REGION: eu-west-3
          FICHIERS: ${{ inputs.fichiers }}
          SIMULATION: ${{ inputs.simulation }}
        run: |
          set -euo pipefail
          # Même lecture des chaînes que la garde syntaxique ; conserver les options déjà configurées.
          export PGOPTIONS="${PGOPTIONS:-} -c standard_conforming_strings=on"
          URL="postgresql://postgres.${REF}@aws-0-${REGION}.pooler.supabase.com:5432/postgres"
          cd app/supabase/migrations

          echo "— historique déjà en base"
          # Version et empreinte (md5 du texte enregistré dans `statements`) : la seconde sert à la garde par contenu.
          psql "$URL" -v ON_ERROR_STOP=1 -Atc \
            "select version || ' ' || coalesce(md5(array_to_string(statements, E'\n')), '-') from supabase_migrations.schema_migrations order by version" \
            > /tmp/deja-empreintes.txt
          cut -d' ' -f1 /tmp/deja-empreintes.txt > /tmp/deja.txt
          echo "  $(wc -l < /tmp/deja.txt) migrations enregistrées"

          echo "— dix dernières versions enregistrées"
          tail -10 /tmp/deja.txt | sed 's/^/   /'

          LISTE="${FICHIERS}"
          if [ -z "$(echo "$LISTE" | tr -d ' ')" ]; then
            echo "✗ Aucun fichier nommé. La liste est obligatoire : les horodatages" >&2
            echo "  des fichiers du dépôt ne correspondent pas à ceux de la base," >&2
            echo "  une détection automatique rejouerait des migrations déjà passées." >&2
            exit 1
          fi

          # Garde-fou : des noms de fichiers SEULS. La saisie l'annonce, mais « ${f%%_*} » laissait passer un chemin
          # (« ../retours-arriere/… ») : la version lue est alors fantaisiste, la garde « déjà enregistrée » est franchie, et
          # un fichier hors de migrations/ serait joué puis inscrit à l'historique (audit du 13/10, RET-01).
          for f in $LISTE; do
            case "$f" in
              *[!A-Za-z0-9._-]*|*..*|.*|-*) echo "✗ nom de fichier seul attendu (lettres, chiffres, _ . -) : $f" >&2; exit 1;;
              *.sql) ;;
              *) echo "✗ un fichier .sql de app/supabase/migrations attendu : $f" >&2; exit 1;;
            esac
          done

          # Garde-fou : refuser une version DÉJÀ enregistrée. Si elle est là,
          # la migration a déjà été appliquée — la rejouer, au mieux ne fait
          # rien, au pire écrase une correction posée depuis.
          for f in $LISTE; do
            v="${f%%_*}"
            if grep -qx "$v" /tmp/deja.txt; then
              echo "✗ $f : la version $v est déjà enregistrée en base." >&2
              exit 1
            fi
          done

          # Garde-fou : refuser un CONTENU déjà appliqué sous un autre numéro. Un fichier renommé, ou une migration
          # passée hors chantier (18/10 : trois fichiers joués par l'outil MCP, enregistrés sous l'heure de leur
          # application et non sous celle de leur nom), n'a pas sa version en base : la garde ci-dessus le laisse
          # passer et il serait REJOUÉ. L'empreinte md5 du fichier, octet pour octet, est comparée à celle du texte
          # enregistré en base (`statements`). Les versions passées par ce chantier portent le texte « appliquée par
          # le chantier GitHub », jamais celui du fichier : elles n'entrent pas en jeu.
          for f in $LISTE; do
            [ -f "$f" ] || { echo "✗ fichier introuvable : $f" >&2; exit 1; }
            v="${f%%_*}"
            empreinte="$(md5sum < "$f" | cut -d' ' -f1)"
            v_base="$(awk -v e="$empreinte" -v v="$v" '$2 == e && $1 != v { print $1; exit }' /tmp/deja-empreintes.txt)"
            if [ -n "$v_base" ]; then
              echo "✗ $f : ce contenu exact (md5 $empreinte) est déjà appliqué en base sous la version $v_base — fichier renommé ou passé hors chantier ; ne pas le rejouer." >&2
              exit 1
            fi
          done
          echo "— à appliquer, dans cet ordre :"
          for f in $LISTE; do
            [ -f "$f" ] || { echo "✗ fichier introuvable : $f" >&2; exit 1; }
            node ../../scripts/verifier-transactions-migration.mjs "$f"
            echo "   · $f"
          done

          # TOUT LE LOT DANS UNE SEULE TRANSACTION. Deux raisons :
          #  — la simulation n'a de sens qu'ainsi. Annuler fichier par fichier
          #    ferait échouer le second faute des tables créées par le premier,
          #    et on croirait à un défaut qui n'existe pas ;
          #  — ces fichiers forment un ensemble. Une moitié appliquée est pire
          #    qu'un échec net : le code trouve des tables et pas les fonctions.
          {
            echo "begin;"
            for f in $LISTE; do
              v="${f%%_*}"
              nom="${f#*_}"; nom="${nom%.sql}"
              echo "\\echo '── $f'"
              cat "$f"
              echo ";"
              echo "insert into supabase_migrations.schema_migrations (version, name, statements)"
              echo "values ('$v', '$nom', array[\$gerimmo\$appliquée par le chantier GitHub\$gerimmo\$])"
              echo "on conflict do nothing;"
            done
            if [ "$SIMULATION" = "true" ]; then echo "rollback;"; else echo "commit;"; fi
          } > /tmp/lot.sql

          echo "— $(wc -l < /tmp/lot.sql) lignes de SQL à jouer"
          psql "$URL" -v ON_ERROR_STOP=1 -f /tmp/lot.sql

          if [ "$SIMULATION" = "true" ]; then
            echo
            echo "SIMULATION : tout a été joué puis annulé. Rien n'est conservé."
            echo "Relancez avec « simulation » décoché pour appliquer pour de bon."
          fi
