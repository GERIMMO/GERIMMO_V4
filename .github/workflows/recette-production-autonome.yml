# Cinq comptes éphémères, propres à chaque passage. Le nettoyage final retire
# leurs dossiers et identités, ainsi que le privilège de supervision temporaire.
# Décision du dirigeant le 21/10 : ne plus conserver les comptes d’essai.
# Aucun paiement réel, aucun message à une personne ; seuls des courriers
# éventuels vers les boîtes de test Resend peuvent partir.
# Aucune trace Playwright ni vidéo n'est déposée : le dépôt est public et une
# trace enregistre les cookies de session. Seuls le rapport HTML et les
# captures d'écran d'échec (données fictives) sont conservés, trois jours.
name: Recette de production avec nettoyage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recette-production
  cancel-in-progress: false
jobs:
  recette:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      RECETTE_URL: https://www.gerimmo.app
      RECETTE_SUFFIXE: r${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dépendances et navigateur
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Vérifier que le nettoyage des fichiers sera possible
        env:
          CLE_NETTOYAGE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$CLE_NETTOYAGE" ]; then
            echo "Nettoyage Storage indisponible : le groupe de test ne sera pas préparé."
            exit 1
          fi
      - name: Préparer les cinq comptes éphémères
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-0-eu-west-3.pooler.supabase.com
          PGPORT: 5432
          PGUSER: postgres.rddlxunppddzpsaatdaz
          PGDATABASE: postgres
          PGSSLMODE: require
        run: node scripts/recette-production-comptes.mjs preparer
      - name: Ouvrir les sessions artisan et supervision avec un vrai second facteur
        run: node scripts/recette-production-sessions.mjs
      - name: Parcourir les espaces en ligne sur téléphone
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-0-eu-west-3.pooler.supabase.com
          PGPORT: 5432
          PGUSER: postgres.rddlxunppddzpsaatdaz
          PGDATABASE: postgres
          PGSSLMODE: require
        run: npx playwright test --config e2e/recette-production/playwright.config.ts
      - name: Supprimer les comptes éphémères, dossiers et supervision
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-0-eu-west-3.pooler.supabase.com
          PGPORT: 5432
          PGUSER: postgres.rddlxunppddzpsaatdaz
          PGDATABASE: postgres
          PGSSLMODE: require
        run: node scripts/recette-production-comptes.mjs purger
      - name: Conserver le rapport (sans trace ni vidéo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recette-production-${{ github.run_id }}
          path: app/e2e/recette-production/.resultats/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
