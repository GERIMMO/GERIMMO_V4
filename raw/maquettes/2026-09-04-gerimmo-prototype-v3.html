<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerimmo — prototype cliquable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#14304F; --encre-2:#1D4066; --laiton:#C9A227; --laiton-clair:#E8DFC9;
  --creme:#FAF7F0; --ivoire:#FFFFFF; --ardoise:#E8EEF4; --bleu:#2F6FB0;
  --rouge:#A32D2D; --rouge-fond:#FCEBEB; --ambre:#BA7517; --ambre-fond:#FAEEDA;
  --vert:#0F6E56; --vert-fond:#E1F5EE;
  --texte:#1C2024; --texte-2:#4A4844; --texte-3:#6E675A; --ligne:#E4DCCA;
  --sans:'Instrument Sans',system-ui,sans-serif; --serif:'Cormorant Garamond',Georgia,serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--creme);color:var(--texte);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:21px} h3{font-size:17px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--bleu);text-decoration:none}
:focus-visible{outline:2px solid var(--laiton);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;color:var(--texte-3)}

/* ---------- chrome ---------- */
.bandeau{background:var(--encre);color:#F5EFE3}
.bandeau-haut{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;max-width:1180px;margin:0 auto}
.marque{display:flex;align-items:center;gap:12px}
.marque span.nom{font-family:var(--serif);font-size:19px;letter-spacing:.26em;color:#F5EFE3}
.sep{width:1px;height:26px;background:rgba(245,239,227,.2)}
.espace-nom{font-size:13px;color:#F5EFE3}
.recherche{display:flex;align-items:center;gap:8px;background:rgba(245,239,227,.09);border:1px solid transparent;border-radius:22px;padding:7px 14px;min-width:250px;color:rgba(245,239,227,.5);font-size:13px;transition:.15s}
.recherche:hover{background:rgba(245,239,227,.14);color:rgba(245,239,227,.8)}
.actions-compte{display:flex;align-items:center;gap:16px}
.cloche{position:relative;font-size:18px;color:rgba(245,239,227,.75);padding:4px}
.pastille{position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--laiton);border:2px solid var(--encre)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--laiton);color:#412402;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center}
.menu-compte{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(245,239,227,.8);padding:4px 6px;border-radius:6px}
.menu-compte:hover{background:rgba(245,239,227,.08)}
.bandeau-nav{border-top:1px solid rgba(245,239,227,.1)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;max-width:1180px;margin:0 auto}
.onglets{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglet{font-size:13px;color:rgba(245,239,227,.6);padding:12px 0;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.onglet:hover{color:#F5EFE3}
.onglet.actif{color:#F5EFE3;border-bottom-color:var(--laiton)}
.badge-nav{background:var(--rouge);color:#fff;font-size:10px;padding:1px 7px;border-radius:20px;margin-left:6px;font-family:var(--mono)}
.btn-or{background:var(--laiton);color:#412402;font-size:13px;padding:6px 14px;border-radius:6px;white-space:nowrap}
.btn-or:hover{background:#D8B23A}

/* ---------- page ---------- */
.page{max-width:1180px;margin:0 auto;padding:24px 28px 56px;position:relative}
.page::before{content:'';position:absolute;top:0;left:28px;right:28px;height:3px;background:var(--sec,transparent)}
.entete-page h1{position:relative}
.entete-page{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.carte{background:var(--ivoire);border:1px solid var(--ligne);border-radius:2px;padding:18px 20px}
.grille-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--ivoire);border:1px solid var(--ligne);border-left:3px solid var(--texte-3);padding:14px 16px}
.kpi{text-align:left;width:100%;display:block;font:inherit;color:inherit}
button.kpi{cursor:pointer;position:relative}
button.kpi::after{content:'›';position:absolute;top:12px;right:14px;color:var(--texte-3);font-size:16px;transition:transform .18s,color .18s}
button.kpi:hover{transform:translateY(-2px);border-color:var(--encre)}
button.kpi:hover::after{transform:translateX(3px);color:var(--encre)}
.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.colonne-liste{background:var(--ivoire);border:1px solid var(--ligne);max-height:calc(100vh - 210px);overflow-y:auto;position:sticky;top:14px}
@media(max-width:900px){.colonne-liste{position:static;max-height:none}}
.rang{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--ligne);border-left:3px solid transparent;transition:background .15s,border-color .15s}
.rang:hover{background:#FCFAF5}
.rang.actif{background:var(--ardoise);border-left-color:var(--encre)}
.rang b{font-weight:500;display:block;font-size:13.5px}
.rang small{display:block;font-size:11.5px;color:var(--texte-2)}
.tete-groupe{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 14px;background:var(--ardoise);border:none;border-bottom:1px solid var(--ligne);border-top:1px solid var(--ligne);position:sticky;top:41px;z-index:1}
.tete-groupe:hover b{color:var(--bleu)}
.tete-groupe b{color:var(--encre);font-weight:500}
.rang-lot{padding-left:26px;position:relative}
.rang-lot::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--ligne)}
.tete-liste{padding:11px 14px;border-bottom:1px solid var(--ligne);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--ivoire);z-index:2}
.sous-onglets{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.sous-onglet{font-size:13px;padding:7px 15px;border:1px solid var(--ligne);background:var(--ivoire);color:var(--texte-2)}
.sous-onglet.actif{background:var(--encre);color:#F5EFE3;border-color:var(--encre)}
.pane{min-width:0}
.pane .entete-page{margin-bottom:14px}
.pane h1{font-size:23px}
.retour-liste{display:none}
@media(max-width:900px){.retour-liste{display:inline-block;margin-bottom:10px}}
.bloc-graph{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{flex:none}
.kpi.rouge{border-left-color:var(--rouge)} .kpi.or{border-left-color:var(--laiton)} .kpi.bleu{border-left-color:var(--bleu)}
.kpi .chiffre{font-family:var(--serif);font-size:29px;line-height:1.1;color:var(--encre)}
.kpi .appui{font-size:12px;color:var(--texte-2)}
.jauge{display:flex;gap:3px;margin:10px 0 7px}
.jauge span{height:4px;display:block}
.deux-col{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){.deux-col{grid-template-columns:1fr}}
.entete-carte{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px}
.lien-discret{font-size:12px;color:var(--bleu)}

/* ---------- alertes ---------- */
.alerte{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-left:3px solid var(--texte-3);border-bottom:1px solid var(--ligne);transition:background .15s}
.alerte:last-child{border-bottom:none}
.alerte:hover{background:#FCFAF5}
.alerte.critique{border-left-color:var(--rouge);background:var(--rouge-fond)}
.alerte.critique:hover{background:#F9E0E0}
.alerte.normale{border-left-color:var(--ambre)}
.alerte .niveau{font-family:var(--mono);font-size:10px;letter-spacing:.12em}
.alerte.critique .niveau{color:var(--rouge)} .alerte.normale .niveau{color:#854F0B} .alerte.info .niveau{color:var(--texte-2)}
.alerte .titre{font-size:14px;margin-top:2px}
.alerte .detail{font-size:12px;color:var(--texte-2)}
.btn{border:1px solid #9E9A8E;color:var(--encre);font-size:12.5px;padding:8px 15px;border-radius:6px;background:var(--ivoire);white-space:nowrap;transition:.15s}
.btn:hover{background:var(--ardoise);border-color:var(--encre)}
.btn-danger{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.btn-danger:hover{background:#8A2424;color:#fff}
.btn-encre{background:var(--encre);color:#F5EFE3;border-color:var(--encre)}
.btn-encre:hover{background:var(--encre-2);color:#F5EFE3}

/* ---------- listes / tableaux ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--texte-3);font-weight:400;padding:0 10px 8px 0;border-bottom:1px solid var(--ligne)}
td{padding:13px 10px 13px 0;border-bottom:1px solid var(--ligne);vertical-align:middle}
tr.cliquable{cursor:pointer}
tr.cliquable:hover td{background:#FCFAF5}
.puce{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:20px;font-family:var(--mono);letter-spacing:.04em}
.p-loue{background:var(--vert-fond);color:#085041} .p-prep{background:var(--ambre-fond);color:#854F0B}
.p-encre{background:var(--ardoise);color:var(--encre)} .p-gris{background:#F1EFE8;color:#5F5E5A}
.p-rouge{background:var(--rouge-fond);color:var(--rouge)}
.barre{height:5px;background:var(--laiton-clair);border-radius:3px;overflow:hidden;min-width:70px}
.barre i{display:block;height:100%}
.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filtre{font-size:12px;padding:5px 13px;border:1px solid var(--ligne);border-radius:20px;background:var(--ivoire);color:var(--texte-2)}
.filtre.actif{background:var(--encre);color:#F5EFE3;border-color:var(--encre)}
.vide{text-align:center;padding:40px 20px;color:var(--texte-2)}

/* ---------- panneau latéral + modale ---------- */
.voile{position:fixed;inset:0;background:rgba(20,48,79,.35);z-index:40}
.panneau{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);background:var(--creme);z-index:50;overflow-y:auto;border-left:1px solid var(--ligne);animation:glisse .22s ease}
@keyframes glisse{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.panneau-tete{background:var(--encre);color:#F5EFE3;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panneau-corps{padding:20px 22px}
.ligne-info{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--ligne);font-size:13px}
.ligne-info span:first-child{color:var(--texte-2)}
.modale{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,92vw);background:var(--creme);z-index:50;border:1px solid var(--ligne);animation:glisse .2s ease}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--encre);color:#F5EFE3;padding:11px 20px;border-radius:2px;z-index:60;font-size:13px;display:flex;gap:9px;align-items:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- vie visuelle ---------- */
@keyframes monte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page>*{animation:monte .34s cubic-bezier(.2,.7,.3,1) both}
.page>*:nth-child(2){animation-delay:.04s}
.page>*:nth-child(3){animation-delay:.08s}
.page>*:nth-child(4){animation-delay:.12s}
.carte,.kpi{transition:transform .18s,box-shadow .18s,border-color .18s}
.carte:hover,.kpi:hover{box-shadow:0 6px 22px rgba(20,48,79,.07)}
.grille-art{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.art{background:var(--ivoire);border:1px solid var(--ligne);text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .18s,box-shadow .18s}
.art:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,48,79,.12)}
.cover{height:96px;display:flex;align-items:flex-end;padding:10px 12px;position:relative;overflow:hidden}
.cover::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.09) 0 2px,transparent 2px 16px)}
.cover .illus{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.cover span{position:relative;z-index:1;color:rgba(255,255,255,.92);font-family:var(--mono);font-size:10px;letter-spacing:.14em}
.art-corps{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.art h4{margin:0;font-family:var(--serif);font-size:17px;font-weight:500;color:var(--encre);line-height:1.25}
.art p{margin:0;font-size:13px;color:var(--texte-2);flex:1}
.art .meta{font-size:11px;color:var(--texte-3);font-family:var(--mono)}
.une{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);background:var(--ivoire);border:1px solid var(--ligne);margin-bottom:16px;text-align:left;width:100%;overflow:hidden}
@media(max-width:700px){.une{grid-template-columns:1fr}}
.une .cover{height:100%;min-height:190px}
.une-corps{padding:20px 22px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.pastille-role{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:3px 9px;border:1px solid currentColor;border-radius:20px}
.lecture{max-width:40em}
.lecture p{line-height:1.7;color:#33383E}
.bot-btn{background:#fff;border:1px solid #cfd8d4;border-radius:18px;padding:7px 13px;font-size:12.5px;color:#075E54;text-align:left}
.bot-btn:hover{background:#DCF8C6;border-color:#075E54}
.bot-carte{background:#fff;border-left:3px solid #075E54;padding:9px 11px;font-size:12.5px;width:100%;margin-bottom:6px}
.bot-carte b{display:block;font-weight:500;color:#111}
.bot-carte div{color:#555}
.assistant{max-width:760px;margin:0 auto}
.assistant-tete{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.assistant-tete .quitter{margin-left:auto}
.etapes-fil{display:flex;gap:0;margin-bottom:26px}
.etape-pas{flex:1;display:flex;flex-direction:column;gap:7px;position:relative}
.etape-pas .rond{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;z-index:1;transition:.25s}
.etape-pas .rond.att{background:var(--ivoire);border:1px solid var(--ligne);color:var(--texte-3)}
.etape-pas .rond.cour{background:var(--encre);color:var(--laiton);box-shadow:0 0 0 4px var(--ardoise)}
.etape-pas .rond.fait{background:var(--vert);color:#fff}
.etape-pas .lib{font-size:11px;color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etape-pas .lib.cour{color:var(--encre);font-weight:500}
.etape-pas::after{content:'';position:absolute;top:13px;left:calc(50% + 16px);right:calc(-50% + 16px);height:1px;background:var(--ligne)}
.etape-pas.fait::after{background:var(--vert)}
.etape-pas:last-child::after{display:none}
.carte-etape{animation:glisse .28s ease}
@keyframes glisse{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.choix-carte{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px 18px;border:1px solid var(--ligne);background:var(--ivoire);margin-bottom:10px;transition:.18s}
.choix-carte:hover{border-color:var(--encre);transform:translateY(-1px)}
.choix-carte.actif{border-color:var(--encre);border-left-width:3px;background:#FCFAF5}
.choix-carte .ic{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--ardoise);color:var(--encre)}
.choix-carte b{display:block;font-weight:500;margin-bottom:2px}
.choix-carte small{color:var(--texte-2);font-size:12.5px;line-height:1.4}
.recap-vivant{background:var(--ardoise);padding:16px 18px;position:sticky;top:14px}
.recap-vivant .lg{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(20,48,79,.08);font-size:13px}
.recap-vivant .lg:last-child{border:none}
.recap-vivant .vide-champ{color:var(--texte-3);font-style:italic}
.pied-etape{display:flex;gap:10px;margin-top:22px;align-items:center}
.pied-etape .compte{margin-left:auto;font-size:12px;color:var(--texte-3);font-family:var(--mono)}
.agenda-corps{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.liste-parc{display:flex;flex-direction:column;gap:10px;max-width:860px}
.bloc-bien{border:1px solid var(--ligne);border-radius:4px;overflow:hidden;background:#fff}
.bloc-bien.ouvert{border-color:var(--laiton)}
.tete-bien{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:transparent;border:none;cursor:pointer;text-align:left;font:inherit;color:var(--encre)}
.tete-bien:hover{background:var(--ardoise)}
.bloc-bien.ouvert .tete-bien{background:var(--ardoise);border-bottom:1px solid var(--ligne)}
.tete-bien .chevron{color:var(--laiton);font-size:12px;width:14px;flex:none}
.tete-bien b{font-weight:500}
.lots-bien{display:flex;flex-direction:column;padding:8px 8px 8px 20px;gap:6px}
.bloc-lot{border:1px solid var(--ligne);border-radius:4px;overflow:hidden;background:#fff}
.bloc-lot.ouvert{border-color:var(--accent)}
.tete-lot{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;background:transparent;border:none;cursor:pointer;text-align:left;font:inherit;color:var(--encre)}
.tete-lot:hover{background:var(--ardoise)}
.bloc-lot.ouvert .tete-lot{background:var(--ardoise);border-bottom:1px solid var(--ligne)}
.tete-lot .chevron{color:var(--accent);font-size:11px;width:12px;flex:none}
.tete-lot b{font-weight:500}
.tete-lot small{display:block;font-size:12px;color:var(--texte-2)}
.detail-lot{padding:16px}
.detail-lot .entete-page{margin-top:0}
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--texte-3);padding:4px 3px;text-align:center;font-weight:400}
.cal td{border:1px solid var(--ligne);vertical-align:top;height:34px;padding:2px 4px;position:relative;overflow:hidden}
.cal td.hors{background:var(--ivoire);opacity:.5}
.cal td.jour-actuel{background:var(--ardoise)}
.cal .num{font-family:var(--serif);font-size:12px;color:var(--texte-2);line-height:1}
.cal td.jour-actuel .num{color:var(--encre);font-weight:600}
.cal .ev{display:block;width:100%;text-align:left;font-size:8.5px;line-height:1.15;padding:1px 3px;margin-top:1px;border-left:2px solid;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .pastille-ev{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:middle}
.cal .plus-ev{font-size:9px;color:var(--texte-3);margin-top:2px;cursor:pointer}
.cal .ev:hover{filter:brightness(.97)}
.cal-tete{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cal-tete h3{font-family:var(--serif);font-size:19px;text-transform:capitalize}
.err{background:var(--rouge-fond);border-left:3px solid var(--rouge);padding:10px 12px;margin-bottom:14px;font-size:13px;color:#501313}
.apercu-art{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--ligne);transition:opacity .15s}
.apercu-art:last-child{border-bottom:none}
.apercu-art:hover{opacity:.72}
.vignette{width:74px;height:58px;flex:none;overflow:hidden;position:relative}
.vignette svg{position:absolute;inset:0;width:100%;height:100%}
@media(max-width:720px){
  .carte table,.kpi{display:block}
  .carte table{overflow-x:auto;white-space:nowrap}
  .bandeau-haut{flex-wrap:wrap;gap:10px;padding:12px 16px}
  .recherche{min-width:0;flex:1}
  .page{padding:18px 16px 48px}
  .nav-inner{padding:0 16px}
  h1{font-size:24px}
  .entete-page{gap:10px}
}
/* ---------- navigation profonde ---------- */
.fil{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--texte-3);margin-bottom:12px}
.fil button{color:var(--bleu)}
.nav-inner{position:relative}
.menu-deroulant{position:absolute;top:100%;right:0;margin-top:8px;background:var(--ivoire);border:1px solid var(--ligne);min-width:250px;z-index:55;box-shadow:0 10px 30px rgba(20,48,79,.16)}
.menu-deroulant button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:13px;border-bottom:1px solid var(--ligne)}
.menu-deroulant button:last-child{border-bottom:none}
.menu-deroulant button:hover{background:var(--ardoise)}
.recherche-modale{position:fixed;top:11vh;left:50%;transform:translateX(-50%);width:min(580px,92vw);background:var(--creme);border:1px solid var(--ligne);z-index:50;max-height:70vh;overflow:hidden;display:flex;flex-direction:column}
.res{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 20px;border-bottom:1px solid var(--ligne);font-size:13px}
.res:hover{background:var(--ardoise)}
.chrono{border-left:2px solid var(--ligne);padding-left:18px;margin:4px 0 0 5px}
.chrono>div{position:relative;padding-bottom:16px}
.chrono>div:last-child{padding-bottom:0}
.chrono>div::before{content:'';position:absolute;left:-23px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--laiton)}
.tot{display:flex;justify-content:space-between;gap:16px;padding:11px 0;font-size:14px;border-top:1px solid var(--ligne)}
.tot.fort{border-top:2px solid var(--encre);font-family:var(--serif);font-size:19px;color:var(--encre)}
.bloc-titre{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--texte-3);margin:0 0 10px}
/* ---------- connexion ---------- */
.ecran-auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
@media(max-width:820px){.ecran-auth{grid-template-columns:1fr}.auth-gauche{display:none}}
.auth-gauche{background:var(--encre);color:#F5EFE3;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between}
.auth-droite{display:flex;align-items:center;justify-content:center;padding:40px 32px}
.champ{display:block;width:100%;padding:11px 13px;border:1px solid var(--ligne);background:var(--ivoire);border-radius:2px;font:inherit;font-size:14px;margin-bottom:14px}
.champ:focus{outline:none;border-color:var(--encre);box-shadow:0 0 0 3px var(--ardoise)}
label.lab{font-size:12px;color:var(--texte-2);display:block;margin-bottom:5px}
.carte-espace{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--ivoire);border:1px solid var(--ligne);padding:16px 18px;margin-bottom:10px;transition:.15s}
.carte-espace:hover{border-color:var(--encre);transform:translateX(3px)}
/* ===== état des lieux — saisie comparative entrée/sortie ===== */
.edl-tete{display:grid;grid-template-columns:minmax(130px,.9fr) minmax(190px,1.1fr) minmax(240px,1.5fr);gap:14px;padding:10px 0 8px;border-bottom:2px solid var(--encre);margin-top:6px}
.edl-ligne{display:grid;grid-template-columns:minmax(130px,.9fr) minmax(190px,1.1fr) minmax(240px,1.5fr);gap:14px;align-items:start;padding:13px 0;border-bottom:1px solid var(--ligne)}
.edl-rappel{background:rgba(20,48,79,.045);border-left:3px solid rgba(20,48,79,.18);padding:9px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:var(--texte-2);line-height:1.45}
.edl-saisie{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edl-saisie select.champ{width:132px;flex:0 0 auto}
.edl-saisie input.champ{flex:1;min-width:150px}
@media(max-width:760px){.edl-tete{display:none}.edl-ligne{grid-template-columns:1fr;gap:9px}}
/* --- vie de l'interface --- */
@keyframes surgir{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fonduPage{from{opacity:0}to{opacity:1}}
#app>*{animation:fonduPage .22s ease}
.carte,.kpi{animation:surgir .38s ease both}
.carte:nth-of-type(2),.kpi:nth-child(2){animation-delay:.05s}
.carte:nth-of-type(3),.kpi:nth-child(3){animation-delay:.1s}
.carte:nth-of-type(4),.kpi:nth-child(4){animation-delay:.15s}
.carte:nth-of-type(5){animation-delay:.2s}
.carte{transition:box-shadow .2s ease,transform .2s ease}
.carte:hover{box-shadow:0 8px 28px rgba(20,48,79,.10)}
button.kpi{transition:box-shadow .2s ease,transform .2s ease}
button.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,48,79,.12)}
.confetti{position:fixed;top:-12px;width:8px;height:8px;z-index:999;pointer-events:none;animation:tomber ease-in forwards}
@keyframes tomber{to{transform:translateY(106vh) rotate(560deg)}}
.pastille-nv{background:var(--rouge);color:#fff;font-size:9.5px;padding:2px 7px;border-radius:9px;letter-spacing:.6px;font-weight:600}
.vignette{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#F5EFE3;font-family:'Cormorant Garamond',serif;font-size:20px;flex:none}
@media (prefers-reduced-motion:reduce){#app>*,.carte,.kpi{animation:none}.confetti{display:none}}

function donut(segs,o={}){
  const t=o.taille||132, ep=o.ep||17, tot=segs.reduce((s,x)=>s+x.v,0)||1;
  const r=(t-ep)/2, c=t/2, circ=2*Math.PI*r; let off=0;
  const arcs=segs.filter(x=>x.v>0).map(x=>{const len=x.v/tot*circ;
    const el=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${x.c}" stroke-width="${ep}" stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${c} ${c})"><title>${x.l} — ${Math.round(x.v/tot*100)} %</title></circle>`;
    off+=len; return el}).join('');
  return `<svg class="donut" viewBox="0 0 ${t} ${t}" width="${t}" height="${t}" role="img" aria-label="${segs.map(x=>x.l+' '+Math.round(x.v/tot*100)+'%').join(', ')}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--laiton-clair)" stroke-width="${ep}"/>${arcs}
    ${o.centre?`<text x="${c}" y="${c+(o.sous?0:6)}" text-anchor="middle" style="font-family:var(--serif);font-size:${Math.round(t*0.23)}px;fill:var(--encre)">${o.centre}</text>`:''}
    ${o.sous?`<text x="${c}" y="${c+16}" text-anchor="middle" style="font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;fill:var(--texte-3)">${o.sous}</text>`:''}</svg>`}
function legende(segs){const tot=segs.reduce((s,x)=>s+x.v,0)||1;
  return `<div style="flex:1;min-width:0">${segs.map(x=>`<div style="display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--ligne)">
    <span style="width:10px;height:10px;background:${x.c};border-radius:2px;flex:none"></span>
    <span style="flex:1;color:var(--texte-2)">${x.l}</span>
    <span style="color:var(--encre)">${x.aff!==undefined?x.aff:x.v}</span>
    <span class="mono" style="color:var(--texte-3);width:36px;text-align:right">${Math.round(x.v/tot*100)} %</span></div>`).join('')}</div>`}
function barres(data,o={}){
  const h=o.h||126, max=Math.max(...data.map(d=>d.v),1);
  return `<div style="display:flex;align-items:flex-end;gap:${o.gap||9}px;height:${h}px">
    ${data.map(d=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%">
      <span class="mono" style="font-size:9.5px;color:var(--texte-2)">${d.aff!==undefined?d.aff:d.v}</span>
      <span title="${d.l} — ${d.aff!==undefined?d.aff:d.v}" style="width:100%;max-width:34px;background:${d.c||o.c||'var(--bleu)'};height:${Math.max(3,Math.round(d.v/max*(h-34)))}px;transition:height .4s"></span>
      <span class="mono" style="font-size:9.5px;color:var(--texte-3)">${d.l}</span></div>`).join('')}</div>`}
function barresDouble(data){
  const h=126, max=Math.max(...data.flatMap(d=>[d.a,d.b]),1);
  return `<div style="display:flex;align-items:flex-end;gap:10px;height:${h}px">

      <span style="display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;flex:1">
        <span title="Encaissé ${d.l} — ${eur(d.a)}" style="width:12px;background:var(--vert);height:${Math.max(3,Math.round(d.a/max*(h-26)))}px"></span>

D.articles=[
  {id:'ART-1',titre:'Une fuite chez vous : les trois gestes des dix premières minutes',tag:'Urgences',aud:['locataire'],auteur:'Gerimmo',src:'admin',date:'02/08/2026',pub:true,
   chapo:'Couper, protéger, signaler. Dans cet ordre, et sans attendre notre réponse.',
   corps:['Coupez l’arrivée d’eau du logement. Le robinet d’arrêt se trouve le plus souvent sous l’évier, dans les toilettes ou dans le placard technique du palier. Si vous ne l’avez jamais repéré, faites-le aujourd’hui : c’est le seul geste qui doit être immédiat.',
     'Protégez ce qui peut l’être : déplacez les meubles et les affaires, posez une bassine, épongez. Une fuite maîtrisée coûte une intervention ; une fuite laissée trois heures coûte un plancher et un litige de voisinage.',
     'Signalez ensuite, depuis votre espace ou par WhatsApp, avec une photo. Vous saurez tout de suite si la réparation est à votre charge ou à celle du propriétaire, et un artisan sera consulté dans la foulée.']},
  {id:'ART-2',titre:'Aérer dix minutes par jour vous évitera une retenue à la sortie',tag:'Entretien',aud:['locataire'],auteur:'Agence Alpha',src:'agence',date:'28/07/2026',pub:true,
   chapo:'Les moisissures sont la première cause de désaccord sur le dépôt de garantie.',
   corps:['La condensation vient de nous : cuisson, douche, respiration, séchage du linge. Un logement occupé produit plusieurs litres de vapeur d’eau par jour, qui se déposent sur les surfaces froides des murs et des angles.',
     'Dix minutes fenêtres ouvertes, matin et soir, même en hiver, suffisent à renouveler l’air sans refroidir les murs. Ne bouchez jamais une grille d’aération, même si elle laisse passer du bruit : signalez-le nous, c’est à nous de traiter.',
     'Si des taches noires apparaissent malgré tout, ne les repeignez pas : signalez-les. Une moisissure liée à un défaut du bâti est à notre charge, mais elle doit être constatée avant l’état des lieux de sortie.']},
  {id:'ART-3',titre:'Encombrants à Morsang-sur-Orge : le calendrier a changé',tag:'Vie du quartier',aud:['locataire'],auteur:'Agence Alpha',src:'agence',date:'21/07/2026',pub:true,
   chapo:'Nouveau passage le premier mardi du mois pour le secteur des Lilas.',
   corps:['La collecte des encombrants passe désormais le premier mardi du mois. Les dépôts se font la veille au soir, sur le trottoir, sans gêner le passage.',
     'Les dépôts hors calendrier sont facturés au syndic, donc répercutés dans vos charges. C’est une ligne qui grimpe vite et que personne n’aime découvrir à la régularisation.']},
  {id:'ART-9',titre:'Travaux d’ascenseur au 12 rue des Lilas',tag:'Travaux',aud:['locataire'],auteur:'Agence Alpha',src:'agence',date:'05/08/2026',pub:false,

  {id:'ART-4',titre:'Décennale et RC pro : ce que nous vérifions avant de vous missionner',tag:'Conformité',aud:['artisan'],auteur:'Gerimmo',src:'admin',date:'01/08/2026',pub:true,
   chapo:'Une attestation expirée bloque l’intervention, même déjà planifiée.',
   corps:['Avant chaque mise en relation, Gerimmo contrôle la validité de votre responsabilité civile professionnelle et, pour les métiers concernés, de votre garantie décennale. Le contrôle est automatique et porte sur la date d’échéance figurant sur l’attestation déposée.',
     'Une attestation expirée suspend la planification : nous ne pouvons pas engager la responsabilité d’un propriétaire sur une intervention non couverte. L’incident repart alors vers un autre artisan du réseau.',
     'Déposez votre nouvelle attestation dès sa réception, sans attendre l’expiration. Le dépôt lève le blocage immédiatement et vous rend éligible aux demandes en cours.']},
  {id:'ART-5',titre:'Répondre sous 24 heures : ce que ça change sur vos chances d’être retenu',tag:'Bonnes pratiques',aud:['artisan'],auteur:'Gerimmo',src:'admin',date:'24/07/2026',pub:true,
   chapo:'Deux artisans sont consultés en parallèle. Le premier devis clair emporte souvent la décision.',
   corps:['Sur les incidents courants, la personne qui décide n’arbitre pas seulement sur le prix : elle arbitre sur le délai et sur la clarté. Un devis reçu le jour même, avec un créneau proposé, est retenu bien plus souvent qu’un devis moins cher arrivé trois jours plus tard.',
     'Indiquez systématiquement un délai d’intervention et ce que couvre le montant. Les demandes sans réponse sous trois jours sont relancées une fois, puis réattribuées.']},
  {id:'ART-6',titre:'DPE : ce qui change pour vos locations cette année',tag:'Réglementation',aud:['proprietaire','agence'],auteur:'Gerimmo',src:'admin',date:'30/07/2026',pub:true,
   chapo:'Le calendrier d’interdiction de louer se resserre. Anticipez sur les lots concernés.',
   corps:['Le diagnostic de performance énergétique conditionne désormais la possibilité même de louer certains logements, avec un calendrier progressif par classe. Un lot mal classé n’est pas seulement moins attractif : il peut devenir non louable à une échéance connue d’avance.',
     'Faites établir le diagnostic avant de fixer le loyer, pas après. Dans Gerimmo, un lot sans DPE reste incomplet et ne peut pas recevoir de bail : c’est volontaire.',
     'Pour les travaux, chiffrez d’abord l’isolation et le mode de chauffage : ce sont les deux postes qui déplacent réellement l’étiquette.']},
  {id:'ART-7',titre:'Encadrement des loyers : vérifiez si votre commune est concernée',tag:'Réglementation',aud:['proprietaire','agence'],auteur:'Gerimmo',src:'admin',date:'18/07/2026',pub:true,
   chapo:'Le loyer de référence majoré s’impose au contrat, quel que soit le marché local.',
   corps:['Dans les zones concernées, le loyer inscrit au bail ne peut pas dépasser un plafond fixé par arrêté, sauf complément justifié par une caractéristique exceptionnelle du logement. Le dépassement expose à une action en diminution de loyer, avec effet rétroactif.',
     'Vérifiez la commune et la période de référence avant chaque nouvelle mise en location, et conservez l’arrêté applicable avec le bail.']},
  {id:'ART-10',titre:'Nouvelle procédure interne : photos obligatoires à chaque EDL',tag:'Métier',aud:['agent'],auteur:'Agence Alpha',src:'gestionnaire',date:'04/08/2026',pub:true,
   chapo:'À partir du 1er septembre, aucun état des lieux ne part sans jeu de photos daté.',
   corps:['Les deux litiges de restitution que nous avons perdus cette année reposaient sur le même point : des observations écrites sans photo. Le juge a retenu que l’état d’entrée n’était pas établi de façon probante.',
     'À compter du 1er septembre, chaque EDL comporte au minimum une vue d’ensemble par pièce et un gros plan par réserve inscrite. Le dépôt se fait depuis l’application, pendant la visite, pas le soir au bureau.']},
  {id:'ART-11',titre:'Qui valide quoi : rappel sur les seuils de l’agence',tag:'Bonnes pratiques',aud:['agent'],auteur:'Agence Alpha',src:'gestionnaire',date:'22/07/2026',pub:true,

  {id:'ART-8',titre:'Régularisation de charges : la méthode qui évite les contestations',tag:'Métier',aud:['agence'],auteur:'Gerimmo',src:'admin',date:'12/07/2026',pub:true,

      <td><b style="font-weight:500">${d.t}</b><div style="font-size:12px;color:var(--texte-2)">${d.etat==='recue'?`v${d.v} · reçue le ${d.date}${d.exp?' · expire le '+d.exp:''}`:`demandée le ${d.dem}${d.v?' · remplacera la v'+d.v:''}`}</div></td>

function demanderPiece(pid){
  const t=val('dp_type');if(!t)return erreur('Choisissez le type de pièce à demander.');
  if(!D.dossiers[pid])D.dossiers[pid]=[];
  if(D.dossiers[pid].some(d=>d.t===t&&d.etat==='attente'))return erreur('Cette pièce est déjà demandée — utilisez plutôt Relancer.');
  D.dossiers[pid].push({t,etat:'attente',dem:'03/09/2026'});
  noter(`Pièce demandée · ${t} — ${(D.personnes.find(x=>x.id===pid)||{}).nom}`);
  rendre();toast('Demande envoyée par e-mail et WhatsApp');
}

function enregistrerEnvoiRapport(periode){
  const c=D.rapportsEnvoyes.find(r=>r.periode===periode);
  c.statut='Envoyé'; c.envoye='05/08/2026'; c.canal=val('rap_canal')||'E-mail';
  const [j,m,a]=['20','08','2026']; c.echeanceVersement='20/08/2026';
  ajouterAlerte({id:'AR-'+periode,niv:'normale',titre:'Versement au propriétaire à faire',detail:`${c.proprio} · rapport ${periode} envoyé le ${c.envoye} · ${eur(c.solde)}`,ech:c.echeanceVersement,rel:'Dans 15 j',module:'Rapport de gestion'});
  noter(`Rapport ${periode} envoyé à ${c.proprio} (${c.canal}) · versement à faire avant le ${c.echeanceVersement}`);
  toast('Envoi enregistré · versement à programmer sous 15 jours');
}
function confirmerVersement(pid,periode,solde,proprio){
  const dispo=soldeMandant(pid);
  const msg=dispo<solde
    ?'⚠ Vous détenez '+eur(dispo)+' pour ce mandant, moins que les '+eur(solde)+' à verser. Vérifiez que tous les loyers du mois ont bien été déclarés avant de virer.'
    :'Le versement de '+eur(solde)+' à '+proprio+' sera inscrit au compte mandant. Le virement doit avoir été passé.';
  demander('Enregistrer le versement au propriétaire',msg,'Marquer versé',()=>marquerVerseRapport(periode));
}
function marquerVerseRapport(periode){
  const c=D.rapportsEnvoyes.find(r=>r.periode===periode);
  c.statut='Versé'; c.verse='05/08/2026';
  D.mouvementsMandants.unshift({date:'05/08/2026',mandant:c.proprio,proprioId:c.proprioId,type:'Versement au propriétaire',sens:'d',mt:c.solde,piece:'Rapport '+periode});
  D.alertes=D.alertes.filter(a=>a.id!=='AR-'+periode&&a.id!=='A2');
  noter(`Versement de ${eur(c.solde)} à ${c.proprio} enregistré · rapport ${periode} soldé`);
  toast('Versement enregistré au compte mandant');
}

const indexRecherche=()=>[
  ...D.lots.map(l=>({t:l.nom+' — '+nomBien(l.bien),s:l.desc,c:'Lot',go:`ouvrirLot('${l.id}')`})),

  ...D.incidents.map(i=>({t:i.id+' — '+(i.cat.split(' — ')[1]||i.cat),s:nomLot(i.lot)+' · '+i.statut,c:'Incident',go:`aller('incident:${i.id}')`})),

  const t=(q||'').trim().toLowerCase();

  return l.map(x=>`<button class="res" onclick="S.recherche=false;${x.go}"><span class="puce p-gris" style="width:74px;justify-content:center">${x.c}</span>

}

const CAT_BOT=[['Une fuite ou un problème d’eau','Plomberie — joint, siphon, robinetterie'],
 ['De l’humidité, une tache au plafond','Humidité — infiltration en toiture'],
 ['Un problème électrique','Électricité — interrupteur, prise, ampoule'],
 ['Le chauffage ou l’eau chaude','Chauffage — entretien annuel de la chaudière'],

 ['Une vitre, une porte, une fenêtre','Menuiserie — vitre brisée']];
const PIECES=['Cuisine','Salle d’eau','Séjour','Chambre','Entrée ou couloir'];
const LIB_LOC={'À qualifier':'Reçu — votre gérant l’examine','Confié au locataire':'À votre charge — à vous de choisir',
 'Devis demandés':'Nous consultons des artisans','Devis à valider':'Devis en cours d’examen','Dispos demandées':'Nous calons une date',

function botMsg(t,de){S.bot.fil.push({de:de||'bot',h:heure(),t})}
function docsLoc(){return D.documents.filter(d=>['Bail signé','Quittance','État des lieux','Annexe de bail','Garantie'].includes(d.type)).slice(0,5)}
function botAction(a,arg){
  const B=S.bot;
  if(a==='menu'){B.etape='menu';botMsg('Que puis-je faire d’autre ?')}
  else if(a==='declarer'){botMsg('Déclarer un problème','loc');B.etape='q1';B.brouillon={};botMsg('D’accord. De quoi s’agit-il ?')}
  else if(a==='q1'){const c=CAT_BOT[arg];botMsg(c[0],'loc');B.brouillon.cat=c[1];B.etape='q2';botMsg('Dans quelle pièce ?')}
  else if(a==='q2'){botMsg(PIECES[arg],'loc');B.brouillon.piece=PIECES[arg];B.etape='q3';botMsg('Depuis quand, et est-ce que ça s’aggrave ?')}
  else if(a==='q3'){const o=[['Aujourd’hui, et ça s’aggrave','Urgent'],['Depuis quelques jours','Normal'],['Depuis longtemps, c’est stable','Normal']][arg];
    botMsg(o[0],'loc');B.brouillon.anciennete=o[0];B.brouillon.urg=o[1];B.etape='photos';
    botMsg('Merci. Envoyez une ou deux photos, cela évite un déplacement pour rien.')}
  else if(a==='photos'){botMsg('[2 photos]','loc');
    const b=B.brouillon;
    const id=creerIncident({cat:b.cat,desc:`${b.cat.split(' — ')[0]} · ${b.piece} · ${b.anciennete}`,urg:b.urg,canal:'WhatsApp',
      lot:'L1',bail:'BA1',dec:'Camille Fabre',decId:'P1',photos:2,piece:b.piece,anciennete:b.anciennete});
    B.etape='menu';botMsg(`C’est enregistré sous la référence ${id}. Votre gérant est prévenu et valide la prise en charge. Je vous tiens au courant ici.`)}
  else if(a==='suivre'){botMsg('Suivre mes signalements','loc');B.etape='suivi';botMsg('Voici vos signalements.')}
  else if(a==='docs'){botMsg('Mes documents','loc');B.etape='docs';botMsg('Vos cinq derniers documents. Vous pouvez les ouvrir, les télécharger ou vous les faire envoyer.')}
  else if(a==='doc'){const d=docsLoc()[arg];botMsg(d.nom,'loc');B.etape='doc';botMsg(`${d.nom} — ${d.type}, déposé le ${d.date}. Que voulez-vous en faire ?`)}
  else if(a==='dl'){botMsg('Téléchargement lancé. Le document reste dans votre espace.');B.etape='docs'}
  else if(a==='mail'){botMsg('Envoyé à votre adresse e-mail.');B.etape='docs'}
  else if(a==='ecrire'){botMsg('Écrire à mon gérant','loc');B.etape='ecrire';botMsg('Écrivez votre message : il arrive directement dans l’interface de votre gérant.')}
  else if(a==='envoyer'){const t=val('bot_msg');if(!t)return;botMsg(t,'loc');envoyerMessage('P1','loc',t);B.etape='menu';
    botMsg('Message transmis à l’Agence Alpha. La réponse arrivera ici.')}
  else if(a==='creneau'){const i=D.incidents.find(x=>x.id===arg.id);S.bot.fil=S.bot.fil;choisirCreneau(arg.id,arg.n);
    botMsg(`${i.dispos[arg.n].d} · ${i.dispos[arg.n].h}`,'loc');botMsg('C’est noté, l’artisan est prévenu. Rappel la veille.');B.etape='menu'}
  else if(a==='note'){noterArtisan(arg.id,arg.n);botMsg(`${arg.n} étoiles`,'loc');botMsg('Merci, le dossier est clos.');B.etape='menu'}
  else if(a==='gestion'){locataireChoisitGestion(arg.id,arg.oui);botMsg(arg.oui?'Demandez-moi des devis':'Je m’en occupe moi-même','loc');
    botMsg(arg.oui?'Entendu, je consulte deux artisans.':'Parfait. Le signalement est clos.');B.etape='menu'}
  rendre();
}
function botBoutons(){
  const B=S.bot, b=(t,a,arg)=>`<button class="bot-btn" onclick='botAction("${a}",${JSON.stringify(arg===undefined?null:arg)})'>${t}</button>`;
  if(B.etape==='menu'){
    let sp='';
    D.incidents.filter(i=>i.decId==='P1').forEach(i=>{
      if(i.statut==='Créneaux proposés')sp+=i.dispos.map((c,n)=>b(`${c.d} · ${c.h}`,'creneau',{id:i.id,n})).join('');
      if(i.statut==='Terminé')sp+=[1,2,3,4,5].map(n=>b(n+'★','note',{id:i.id,n})).join('');
      if(i.statut==='Confié au locataire')sp+=b('Demandez-moi des devis','gestion',{id:i.id,oui:true})+b('Je m’en occupe','gestion',{id:i.id,oui:false});
    });
    return sp+b('Déclarer un problème','declarer')+b('Suivre mes signalements','suivre')+b('Mes documents','docs')+b('Écrire à mon gérant','ecrire');
  }
  if(B.etape==='q1')return CAT_BOT.map((c,n)=>b(c[0],'q1',n)).join('');
  if(B.etape==='q2')return PIECES.map((c,n)=>b(c,'q2',n)).join('');
  if(B.etape==='q3')return ['Aujourd’hui, et ça s’aggrave','Depuis quelques jours','Depuis longtemps, c’est stable'].map((c,n)=>b(c,'q3',n)).join('');
  if(B.etape==='photos')return b('📷 Envoyer 2 photos','photos');
  if(B.etape==='suivi')return D.incidents.filter(i=>i.decId==='P1').map(i=>`<div class="bot-carte"><b>${i.cat.split(' — ')[1]||i.cat}</b>
    <div>${i.id} · ${LIB_LOC[i.statut]||i.statut}</div>${i.creneau?`<div>Rendez-vous le ${i.creneau.d}, ${i.creneau.h}</div>`:''}</div>`).join('')+b('Retour au menu','menu');
  if(B.etape==='docs')return docsLoc().map((d,n)=>b(d.nom.replace('.pdf',''),'doc',n)).join('')+b('Retour au menu','menu');
  if(B.etape==='doc')return b('📄 Ouvrir','dl')+b('⬇ Télécharger','dl')+b('✉ Me l’envoyer par mail','mail')+b('Retour','docs');
  if(B.etape==='ecrire')return `<input id="bot_msg" class="champ" style="margin:0 0 8px" placeholder="Votre message…">`+b('Envoyer','envoyer')+b('Annuler','menu');
  return b('Retour au menu','menu');
}

/* ============ assistant de création guidé ============ */
function ouvrirAssistant(type){
  S.assistant={type,pas:0,data:{}}; S.sel={parc:null,incidents:null,personnes:null,compta:null,docs:null,messages:null};
  window.scrollTo({top:0}); rendre();
}
function fermerAssistant(){S.assistant=null;rendre()}
function majAssistant(champ,valeur){S.assistant.data[champ]=valeur;
  // met à jour le récap vivant sans re-render (préserve le focus du champ)
  const z=document.getElementById('recap-zone');if(z){const A=S.assistant,def=ASSISTANTS[A.type];
    z.innerHTML=def.recap(A.data)+(def.note?`<p style="font-size:12px;color:var(--texte-2);margin:14px 0 0;border-top:1px solid rgba(20,48,79,.08);padding-top:12px">${def.note(A.data)}</p>`:'')}}
function passerA(n){const A=S.assistant, def=ASSISTANTS[A.type];
  if(n>A.pas){const err=def.etapes[A.pas].valide?def.etapes[A.pas].valide(A.data):null;
    if(err){erreurAssistant(err);return}}
  A.pas=Math.max(0,Math.min(def.etapes.length-1,n)); document.getElementById('erreurs')&&(document.getElementById('erreurs').innerHTML='');
  window.scrollTo({top:0}); rendre();
}
function erreurAssistant(msg){const z=document.getElementById('erreurs');if(z)z.innerHTML=`<div class="err">${msg}</div>`}
function choisir(champ,valeur,avance){S.assistant.data[champ]=valeur;if(avance)S.assistant.pas++;rendre()}
function choisirType(t){S.assistant.data.type=t;if(t!=='Immeuble')S.assistant.data.nb='1';
  S.assistant.pas=1; window.scrollTo({top:0}); rendre()}
function finirAssistant(){const A=S.assistant, def=ASSISTANTS[A.type];
  const actives=def.etapesActives?def.etapesActives(A.data):def.etapes.map((_,n)=>n);
  for(const idx of actives){const err=def.etapes[idx].valide?def.etapes[idx].valide(A.data):null;
    if(err){A.pas=idx;rendre();return erreurAssistant(err)}}
  def.creer(A.data);
}
function enregistrerAssistant(){const A=S.assistant, def=ASSISTANTS[A.type];
  // enregistrer ce qui est saisi jusqu'ici, sans forcer la fin du parcours
  if(def.enregistrer)def.enregistrer(A.data);
}
function pageAssistant(){
  const A=S.assistant, def=ASSISTANTS[A.type], et=def.etapes[A.pas];
  const actives=def.etapesActives?def.etapesActives(A.data):def.etapes.map((_,n)=>n);
  const posActuelle=actives.indexOf(A.pas), dernier=posActuelle===actives.length-1;
  return `<div class="assistant">
    <div class="assistant-tete">
      <div>${LOGO(30)}</div>
      <div><span class="eyebrow">${def.surtitre}</span><h1 style="margin:2px 0 0;font-size:24px">${def.titre}</h1></div>
      <button class="btn quitter" onclick="demander('Abandonner la création ?','Ce que vous avez commencé à saisir ne sera pas enregistré.','Abandonner',()=>fermerAssistant(),true)">Quitter</button>
    </div>
    <div class="etapes-fil">${actives.map((idx,pos)=>{const e=def.etapes[idx],fait=actives.indexOf(A.pas)>pos;
      return `<div class="etape-pas ${fait?'fait':''}">
      <span class="rond ${fait?'fait':idx===A.pas?'cour':'att'}">${fait?'✓':pos+1}</span>
      <span class="lib ${idx===A.pas?'cour':''}">${e.titre}</span></div>`}).join('')}</div>
    <div class="deux-col" style="align-items:start">
      <div class="carte carte-etape" key="${A.pas}">
        <div id="erreurs"></div>
        <p class="eyebrow" style="margin-bottom:4px">ÉTAPE ${posActuelle+1} SUR ${actives.length}</p>
        <h3 style="margin-bottom:6px">${et.titre}</h3>
        ${et.aide?`<p style="color:var(--texte-2);margin:0 0 16px;font-size:13.5px">${et.aide}</p>`:''}
        ${et.corps(A.data)}
        <div class="pied-etape">
          ${posActuelle>0?`<button class="btn" onclick="passerA(${actives[posActuelle-1]})">‹ Retour</button>`:''}
          ${dernier?`<button class="btn btn-encre" onclick="finirAssistant()">${def.bouton}</button>`
            :`<button class="btn btn-encre" onclick="passerA(${actives[posActuelle+1]})">Continuer ›</button>`}
          ${def.enregistrable&&def.enregistrer?`<button class="btn" onclick="enregistrerAssistant()">Enregistrer et quitter</button>`:''}
        </div>
      </div>
      <div class="recap-vivant">
        <p class="eyebrow" style="margin-bottom:12px">${def.recapTitre}</p>
        <div id="recap-zone">${def.recap(A.data)}
        ${def.note?`<p style="font-size:12px;color:var(--texte-2);margin:14px 0 0;border-top:1px solid rgba(20,48,79,.08);padding-top:12px">${def.note(A.data)}</p>`:''}</div>
      </div>
    </div>
  </div>`}
const champ=(d,k,ph,type)=>`<input class="champ" value="${(d[k]||'').replace(/"/g,'&quot;')}" ${type?`type="${type}"`:''} placeholder="${ph||''}" oninput="majAssistant('${k}',this.value)">`;
const rl=(lib,val)=>`<div class="lg"><span style="color:var(--texte-2)">${lib}</span><span>${val||'<span class="vide-champ">à renseigner</span>'}</span></div>`;
/* ============ définitions des assistants ============ */
const TYPES_BIEN=[['Immeuble','Plusieurs lots sous une même adresse','▤'],['Appartement','Un logement dans une copropriété','▦'],
  ['Maison','Une maison individuelle','⌂'],['Local commercial','Bail commercial ou professionnel','▧'],['Garage / parking','Un emplacement, souvent en complément','▭']];
const ASSISTANTS={
  bien:{surtitre:'PARC',titre:'Ajouter un bien',bouton:'Créer le bien et ses lots',recapTitre:'VOTRE BIEN',
    note:d=>d.type==='Immeuble'?`Vos ${d.nb||'…'} lots seront créés. Vous pourrez enchaîner directement sur la mise en location.`:`Le lot sera créé, prêt à recevoir un bail dans la foulée.`,
    // l'étape "lots" (nombre) n'existe que pour un immeuble : cheminement adaptatif
    etapesActives:d=>d.type==='Immeuble'?[0,1,2]:[0,1],
    etapes:[
      {titre:'Type',aide:'De quoi s’agit-il ? Ce choix règle la suite : un immeuble aura plusieurs lots, une maison un seul. Cliquez pour avancer.',
        corps:d=>TYPES_BIEN.map(([t,sous,ic])=>`<button class="choix-carte ${d.type===t?'actif':''}" onclick="choisirType('${t}')">
          <span class="ic">${ic}</span><span><b>${t}</b><small>${sous}</small></span>${d.type===t?'<span style="margin-left:auto;color:var(--vert)">✓</span>':''}</button>`).join(''),
        valide:d=>d.type?null:'Choisissez un type de bien pour continuer.'},
      {titre:'Adresse',aide:'Où se trouve ce bien ? L’adresse identifie tous ses lots.',
        corps:d=>`<label class="lab">Adresse *</label>${champ(d,'adr','12 rue des Lilas')}
          <label class="lab">Commune *</label>${champ(d,'ville','Morsang-sur-Orge')}
          <label class="lab">Code postal</label>${champ(d,'cp','91390')}
          ${d.type!=='Immeuble'?`<div style="background:var(--ardoise);padding:12px 14px;font-size:12.5px;color:var(--encre);margin-top:14px">Un ${(d.type||'bien').toLowerCase()} compte un seul lot : il sera créé automatiquement, prêt à recevoir un bail.</div>`:''}`,
        valide:d=>(d.adr&&d.ville)?null:'L’adresse et la commune sont nécessaires.'},
      {titre:'Lots',aide:'Combien de lots compte cet immeuble ? Vous pourrez en ajouter plus tard.',
        corps:d=>`<label class="lab">Nombre de lots</label>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <button class="btn" onclick="const n=Math.max(1,(+S.assistant.data.nb||1)-1);majAssistant('nb',String(n));document.getElementById('nb-aff').textContent=n">−</button>
            <span id="nb-aff" style="font-family:var(--serif);font-size:26px;color:var(--encre);min-width:48px;text-align:center">${d.nb||1}</span>
            <button class="btn" onclick="const n=Math.min(24,(+S.assistant.data.nb||1)+1);majAssistant('nb',String(n));document.getElementById('nb-aff').textContent=n">+</button>
            <span style="font-size:13px;color:var(--texte-2);margin-left:8px">lot${(+d.nb||1)>1?'s':''}</span></div>
          <p style="font-size:12px;color:var(--texte-2);margin:10px 0 0">Chacun aura sa fiche, son bail et sa comptabilité propres. Ils apparaîtront en préparation dans votre parc.</p>`,
        valide:d=>null}
    ],
    recap:d=>`${rl('Type',d.type)}${rl('Adresse',d.adr)}${rl('Commune',d.ville?d.ville+(d.cp?' ('+d.cp+')':''):'')}${rl('Lots',d.type==='Immeuble'?(d.nb||'1'):'1 (automatique)')}`,
    creer:d=>{const nb=d.type==='Immeuble'?parseInt(d.nb||'1',10):1;
      const id=creerBien({adr:d.adr,ville:d.ville,type:d.type,nb});
      // on ne quitte pas l'assistant : on bascule sur l'étape de continuité
      S.assistant.bienId=id; S.assistant.lots=D._derniersLots.slice();
      S.assistant.type='_apresBien'; S.assistant.pas=0;
      S.assistant.data={bienId:id,adr:d.adr,ville:d.ville,nb,lots:D._derniersLots.slice(),lotBail:D._derniersLots[0]};
      window.scrollTo({top:0}); rendre();
      toast(`${nb} lot${nb>1?'s créés':' créé'}`)}},

  // maillon de continuité : le bien mène naturellement au lot puis au bail.
  // Pas de question : on avance dans le chemin logique, avec la possibilité d'enregistrer à tout moment.
  _apresBien:{surtitre:'PARC',titre:'Mettre en location',bouton:'Créer le bail et la 1re quittance',recapTitre:'MISE EN LOCATION',
    enregistrable:true,
    note:d=>d.nature?(LOI_BAIL[d.nature]||'Le lot passera en loué et la première quittance sera émise.'):'Poursuivez pour louer ce lot, ou enregistrez : les lots restent en préparation dans le parc.',
    etapes:[
      {titre:'Le lot',aide:d=>{const n=d.lots?d.lots.length:1;return `Vous avez créé ${n} lot${n>1?'s':''}. Précisez celui que vous mettez en location — les autres resteront en préparation.`},
        corps:d=>{const lots=d.lots.map(id=>D.lots.find(l=>l.id===id)).filter(Boolean);
          const lid=d.lotBail||d.lots[0];
          return `${lots.length>1?`<label class="lab">Lot à mettre en location</label>
            <select class="champ" onchange="majAssistant('lotBail',this.value)">${lots.map(l=>`<option value="${l.id}" ${lid===l.id?'selected':''}>${l.nom}</option>`).join('')}</select>`:''}
            <label class="lab">Type de lot</label>
            <select class="champ" onchange="majAssistant('lotDesc',this.value)">${['T1 · studio','T2','T3','T4','T5 et plus','Maison','Local commercial','Garage'].map(t=>`<option ${d.lotDesc===t?'selected':''}>${t}</option>`).join('')}</select>
            <label class="lab">Surface (m²)</label>${champ(d,'lotSurf','44','number')}
            <label class="lab">Propriétaire</label>
            <select class="champ" onchange="majAssistant('lotProprio',this.value)">${D.personnes.filter(p=>p.role==='Propriétaire mandant').map(p=>p.nom).map(nm=>`<option ${d.lotProprio===nm?'selected':''}>${nm}</option>`).join('')}</select>`},
        valide:d=>d.lotSurf?null:'Indiquez la surface du lot.'},
      {titre:'Le bail',aide:'Le type de bail règle la durée et le dépôt. Le récapitulatif se met à jour.',
        corps:d=>(D.naturesBail||['Bail nu (loi 1989)','Bail meublé','Bail mobilité','Bail commercial','Bail étudiant']).map((nm,ni)=>`
          <button class="choix-carte ${d.nature===nm?'actif':''}" onclick="choisir('nature',(D.naturesBail||['Bail nu (loi 1989)','Bail meublé','Bail mobilité','Bail commercial','Bail étudiant'])[${ni}],true)">
            <span class="ic">◈</span><span><b>${nm}</b><small>${(LOI_BAIL[nm]||'Règles standard.').split('.')[0]}.</small></span></button>`).join(''),
        valide:d=>d.nature?null:'Choisissez le type de bail.'},
      {titre:'Locataire',aide:'Qui entre dans le logement, et à quel loyer ?',
        corps:d=>`<label class="lab">Locataire *</label>${champ(d,'loc','Nom du locataire')}
          <div style="display:flex;gap:12px">
            <span style="flex:1"><label class="lab">Loyer hors charges *</label>${champ(d,'loyer','640','number')}</span>
            <span style="flex:1"><label class="lab">Charges</label>${champ(d,'charges','0','number')}</span></div>
          <label class="lab">Date d’effet</label>${champ(d,'debut','01/09/2026')}`,
        valide:d=>!d.loc?'Le nom du locataire est nécessaire.':(!d.loyer||isNaN(+d.loyer))?'Le loyer doit être un montant.':null}
    ],
    recap:d=>{const lid=d.lotBail||(d.lots&&d.lots[0]), l=lid?D.lots.find(x=>x.id===lid):null;
      return `${rl('Bien',d.adr)}${rl('Lot',l?l.nom:'')}${rl('Surface',d.lotSurf?d.lotSurf+' m²':'')}${rl('Propriétaire',d.lotProprio)}
        ${rl('Bail',d.nature)}${rl('Locataire',d.loc)}${rl('Loyer',d.loyer?eur(+d.loyer):'')}
        ${d.loyer?`<div class="lg" style="font-weight:500"><span>Quittance</span><span>${eur(+d.loyer+(+d.charges||0))}</span></div>`:''}`},
    // enregistrer et quitter à n'importe quelle étape : garde ce qui est saisi, sans créer le bail
    enregistrer:d=>{

            optionsRatt=`<optgroup label="Locataires">${mesPersonnes().filter(pp=>pp.role==='Locataire').map(pp=>`<option value="Garant de ${pp.nom}" ${d.lien==='Garant de '+pp.nom?'selected':''}>Garant de ${pp.nom}</option>`).join('')}</optgroup>`;

        valide:d=>d.nom?null:'Indiquez au moins un nom ou une raison sociale.'}

function creerBienForm(){
  const adr=val('adr'),ville=val('ville'),nb=parseInt(val('nb')||'1',10);
  if(!adr||!ville)return erreur('L’adresse et la commune sont nécessaires pour créer le bien.');
  const id=creerBien({adr,ville,type:val('type'),nb});
  S.sousParc='biens'; aller('bien:'+id); toast(`${nb} lot${nb>1?'s créés':' créé'} en préparation`);
}
function creerPersonneForm(){
  const nom=val('nom'); if(!nom)return erreur('Indiquez au moins un nom ou une raison sociale.');
  const id=creerPersonne({nom,role:val('role'),lien:val('lien')});
  aller('personne:'+id); toast('Fiche créée');
}
function creerBailForm(){
  const loc=val('loc'),loyer=val('loyer');
  if(!loc)return erreur('Le nom du locataire est nécessaire.');
  if(!loyer||isNaN(+loyer))return erreur('Le loyer doit être un montant en euros.');
  const id=creerBail({lot:val('lot'),nature:val('nature'),locataire:loc,loyer,charges:val('charges')||0,debut:val('debut')});
  aller('bail:'+id); toast('Bail créé · lot passé en loué');
}
function creerIncidentForm(){
  const cat=val('icat'),desc=val('idesc');
  if(!cat)return erreur('Choisissez une catégorie : c’est elle qui détermine qui paie.');
  if(desc.length<10)return erreur('Décrivez le problème en une phrase au moins, l’artisan en a besoin pour chiffrer.');
  const lot=val('ilot'), b=D.baux.find(x=>x.lot===lot&&x.etat!=='sorti');
  const id=creerIncident({cat,desc,urg:val('iurg'),canal:'Agence',lot,bail:b?b.id:null,dec:b?b.locataire:'Agence Alpha',decId:b?b.locId:null,piece:val('ipiece'),anciennete:'Signalé par l’agence'});
  aller('incident:'+id); toast('Incident ouvert · devis demandés');
}

    <span style="font-family:var(--serif);font-size:19px;color:var(--encre)">${l.compl} %</span></span></div>
  <div class="deux-col"><div class="carte">
    <div id="erreurs"></div>

        : `<label class="lab" for="f_autres">${m}</label><input class="champ" id="f_autres" placeholder="Renseigner">`}).join('')

  </div>
  <div class="carte" style="border-left:3px solid ${couleurCompl(l.compl)}">
    <h3 style="margin-bottom:10px">Ce qu’il manque encore</h3>
    ${l.manque.length?l.manque.map(m=>`<div style="font-size:13px;color:var(--texte-2);padding:5px 0">— ${m}</div>`).join(''):'<p style="color:var(--vert);margin:0">Lot prêt à la mise en location.</p>'}
    <p style="font-size:12px;color:var(--texte-2);margin:14px 0 0">Un lot ne peut pas recevoir de bail tant que le propriétaire n’est pas rattaché : c’est lui qui perçoit les loyers.</p>
  </div></div>`}
function completerForm(lotId){
  const vals={proprio:val('f_proprio'),surface:val('f_surface'),dpe:val('f_dpe'),autres:val('f_autres')};
  if(!vals.proprio&&!vals.surface&&!vals.dpe&&!vals.autres)return erreur('Renseignez au moins un élément avant d’enregistrer.');
  completerLot(lotId,vals);
  const l=D.lots.find(x=>x.id===lotId);
  selectionner('parc',l.manque.length?'completer:'+lotId:'lot:'+lotId);
  toast(l.manque.length?`Enregistré · ${l.manque.length} élément(s) restant(s)`:`${l.nom} est complet`);
}

function basculerPub(id){const a=D.articles.find(x=>x.id===id);a.pub=!a.pub;noter(`Article ${a.pub?'publié':'dépublié'} : ${a.titre.slice(0,40)}…`);toast(a.pub?'Article publié':'Article dépublié')}
function publierArticleForm(){
  const titre=val('a_titre'),chapo=val('a_chapo'),corps=val('a_corps');
  if(!titre)return erreur('Un titre est nécessaire : c’est ce que vos lecteurs verront en premier.');
  if(corps.length<40)return erreur('Le corps de l’article est trop court pour être utile. Deux ou trois phrases au minimum.');
  const admin=S.espace==='admin';
  const a={id:'ART-'+(D.articles.length+10),titre,chapo:chapo||titre,tag:val('a_tag'),
    aud:admin?[val('a_aud')]:[S.cible||'locataire'],auteur:admin?'Gerimmo':(S.espace==='proprio'?'Hélène Rouvier':'Agence Alpha'),
    src:admin?'admin':'gestionnaire',date:'05/08/2026',pub:true,corps:corps.split('\n').filter(Boolean)};
  D.articles.unshift(a);
  noter(`Article publié : ${titre.slice(0,40)}…`);
  aller('article:'+a.id); toast('Article publié');
}

function declarerMouvement(){
  const mandant=val('fm_mandant'), type=val('fm_type'), sens=val('fm_sens'), mt=+val('fm_mt'), piece=val('fm_piece');
  if(!mt||mt<=0)return erreur('Indiquez un montant supérieur à zéro.');
  const pid=(D.personnes.find(p=>p.nom===mandant)||{}).id||(mandant==='SCI Marchand'?'P3':'P5');
  D.mouvementsMandants.unshift({date:'05/08/2026',mandant,proprioId:pid,type,sens,mt,piece:piece||type});
  noter(`Mouvement mandant déclaré · ${mandant} · ${sens==='c'?'+':'−'}${eur(mt)} · ${type}`);
  toast('Mouvement enregistré · solde du mandant recalculé');
}

      <div style="margin-top:14px"><button class="btn" onclick="aller('articles')">Voir ce que lisent vos agents</button></div></div>
  </div>`}
function adminEquipe(){
  return `<div class="carte">
    <div class="entete-carte"><h3>Utilisateurs de l’agence</h3><button class="btn-or" onclick="toast('Invitation par e-mail · rôle à choisir')">+ Inviter</button></div>
    <table><tbody>${D.utilisateurs.map(u=>`<tr><td><b style="font-weight:500">${u.nom}</b><div style="font-size:12px;color:var(--texte-2)">${u.mail}</div></td>
      <td><span class="puce ${u.role==='Admin agence'?'p-encre':'p-gris'}">${u.role}</span></td>
      <td style="font-size:12px;color:var(--texte-2)">${u.dernier}</td>
      <td style="text-align:right"><button class="btn" onclick="toast('Modification du rôle et des accès')">Modifier</button></td></tr>`).join('')}</tbody></table>

/* ============ devis créé par l’artisan ============ */
function pArtDevis(incId){
  const i=D.incidents.find(x=>x.id===incId), l=D.lots.find(x=>x.id===i.lot), b=D.biens.find(x=>x.id===l.bien);
  const suggestion={'Plomberie':['Recherche de fuite et remplacement du siphon',1,140],'Humidité':['Reprise d’étanchéité en toiture, zone 4 m²',1,780],
    'Électricité':['Mise en conformité du tableau électrique',1,520],'Serrurerie':['Remplacement du cylindre, fourniture comprise',1,145],
    'Chauffage':['Entretien et remise en service de la chaudière',1,180],'Menuiserie':['Remplacement d’un vitrage simple',1,210],'Nuisibles':['Traitement complet, 2 passages',2,145]}[i.cat.split(' — ')[0]]||['Intervention',1,150];
  const pr=`<span class="mono" style="font-size:9px;color:var(--vert);letter-spacing:.1em;margin-left:6px">PRÉ-REMPLI</span>`;
  return `<div class="entete-page"><div><span class="eyebrow">DEVIS · ${i.id}</span><h1 style="margin-top:2px">${i.cat.split(' — ')[1]||i.cat}</h1></div>
    <button class="btn" onclick="aller('ademandes')">Abandonner</button></div>
  <div class="deux-col">
    <div class="carte">
      <div id="erreurs"></div>
      <p class="bloc-titre">CHANTIER ${pr}</p>
      <div class="ligne-info"><span>Adresse</span><span>${b.adr}, ${b.ville}</span></div>
      <div class="ligne-info"><span>Lot</span><span>${l.nom} · ${l.desc}</span></div>
      <div class="ligne-info"><span>Donneur d’ordre</span><span>Agence Alpha, mandataire</span></div>
      <div class="ligne-info"><span>Occupant sur place</span><span>${i.dec}</span></div>
      <p style="font-size:13px;color:var(--texte-2);margin:12px 0 0">Demande du locataire : « ${i.desc} »</p>
      <p class="bloc-titre" style="margin-top:22px">PRESTATIONS ${pr}</p>
      <label class="lab" for="v_lib1">Désignation <span style="color:var(--texte-3)">— vos tarifs : ${D.artisanProfil.tarifs.slice(0,3).map(t=>t.lib+' '+eur(t.prix)).join(' · ')}</span></label>
      <input class="champ" id="v_lib1" value="${suggestion[0]}">
      <div style="display:flex;gap:12px">
        <span style="flex:1"><label class="lab" for="v_qte1">Quantité</label><input class="champ" id="v_qte1" type="number" value="${suggestion[1]}" oninput="majDevis()"></span>
        <span style="flex:1"><label class="lab" for="v_pu1">Prix unitaire HT</label><input class="champ" id="v_pu1" type="number" value="${suggestion[2]}" oninput="majDevis()"></span></div>
      <label class="lab" for="v_lib2">Ligne supplémentaire (facultatif)</label><input class="champ" id="v_lib2" placeholder="Déplacement, fourniture…">
      <div style="display:flex;gap:12px">
        <span style="flex:1"><label class="lab" for="v_qte2">Quantité</label><input class="champ" id="v_qte2" type="number" value="0" oninput="majDevis()"></span>
        <span style="flex:1"><label class="lab" for="v_pu2">Prix unitaire HT</label><input class="champ" id="v_pu2" type="number" value="0" oninput="majDevis()"></span></div>
      <div style="display:flex;gap:12px">
        <span style="flex:1"><label class="lab" for="v_tva">TVA</label><select class="champ" id="v_tva" onchange="majDevis()"><option value="10">10 % — entretien, logement de plus de 2 ans</option><option value="5.5">5,5 % — rénovation énergétique</option><option value="20">20 % — autres cas</option></select></span>
        <span style="flex:1"><label class="lab" for="v_delai">Délai d’intervention</label><select class="champ" id="v_delai"><option>Sous 48 h</option><option>Sous 5 jours</option><option>Sous 10 jours</option></select></span></div>
      <button class="btn btn-encre" style="width:100%;padding:11px;margin-top:8px" onclick="envoyerDevis('${i.id}')">Envoyer le devis à l’agence</button>
    </div>
    <div>
      <div class="carte" style="margin-bottom:14px"><h3 style="margin-bottom:12px">Totaux</h3><div id="totaux">${totauxDevis(suggestion[1]*suggestion[2],10)}</div></div>
      <div class="carte"><h3 style="margin-bottom:10px">Vos informations ${pr}</h3>
        <div class="ligne-info"><span>Entreprise</span><span>${ARTISAN}</span></div>
        <div class="ligne-info"><span>SIRET</span><span class="mono">812 447 903 00021</span></div>
        <div class="ligne-info"><span>Assurance décennale</span><span class="puce ${D.personnes.find(p=>p.id===ARTID).ok?'p-loue':'p-rouge'}">${D.personnes.find(p=>p.id===ARTID).ok?'Valide':'Expirée'}</span></div>
        <div class="ligne-info"><span>Validité du devis</span><span>30 jours</span></div>
        <p style="font-size:12px;color:var(--texte-2);margin:12px 0 0">Ces champs viennent de votre fiche et du dossier d’incident. Vous ne saisissez que ce que vous seul pouvez chiffrer.</p></div>
    </div>
  </div>`}
function totauxDevis(ht,tva){
  const t=ht*tva/100;
  return `<div class="ligne-info"><span>Total HT</span><span>${eur(ht)}</span></div>
  <div class="ligne-info"><span>TVA ${String(tva).replace('.',',')} %</span><span>${eur(t)}</span></div>
  <div class="tot fort"><span>Total TTC</span><span>${eur(ht+t)}</span></div>`}
function majDevis(){
  const ht=(+val('v_qte1')||0)*(+val('v_pu1')||0)+(+val('v_qte2')||0)*(+val('v_pu2')||0);
  const z=document.getElementById('totaux'); if(z)z.innerHTML=totauxDevis(ht,+val('v_tva')||10);
}
function envoyerDevis(incId){
  const ht=(+val('v_qte1')||0)*(+val('v_pu1')||0)+(+val('v_qte2')||0)*(+val('v_pu2')||0);
  if(!val('v_lib1'))return erreur('Décrivez au moins une prestation : c’est ce que l’agence compare.');
  if(ht<=0)return erreur('Le total est à zéro. Renseignez une quantité et un prix unitaire.');
  const tva=+val('v_tva')||10, ttc=ht*(1+tva/100);
  const i=D.incidents.find(x=>x.id===incId), d=i.devis.find(x=>x.art===ARTISAN&&!x.recu);
  if(d){d.recu=heure();d.mt=Math.round(ttc*100)/100;d.delai=val('v_delai');
    if(!i.devis.some(x=>x.choisi)){d.choisi=true;i.statut=(i.imput==='Bailleur'&&d.mt>D.parametres.seuil)?'Devis à valider':'À planifier'}}
  D.documents.unshift({nom:`Devis ${incId} — ${ARTISAN}.pdf`,type:'Devis',date:'05/08/2026',rat:[incId,nomLot(i.lot),ARTISAN],cons:'10 ans'});
  noter(`Devis établi par ${ARTISAN} pour ${incId} · ${eur(ttc)} TTC`);
  aller('ademandes'); toast(`Devis de ${eur(ttc)} TTC envoyé à l’agence`);
}

/* ============ rendu ============ */
function rendre(){
  let html='';
  if(S.ecran==='connexion')html=ecranConnexion();
  else if(S.ecran==='inscription')html=ecranInscription();
  else if(S.ecran==='verif')html=ecranVerifEmail();
  else if(S.ecran==='oubli')html=ecranOubli();
  else if(S.ecran==='nvmdp')html=ecranNouveauMdp();
  else if(S.ecran==='invitation')html=ecranInvitation();
  else if(S.ecran==='artisan1')html=ecranArtisan1();
  else if(S.ecran==='artisan2')html=ecranArtisan2();
  else if(S.ecran==='espaces')html=ecranEspaces();
  else if(S.assistant){html=chromeNu(pageAssistant());
    if(S.confirm)html+=modaleConfirm();}
  else{
    const [pg,arg]=S.page.split(':');
    const communs={articles:()=>pageArticles(AUD_ESPACE[S.espace]),article:pageArticle,nouveau:pageNouveau};
    let chromeFn=chrome, pages, defaut='bord';
    if(S.espace==='proprio'){chromeFn=chromeProprio;defaut='plots';
      pages={plots:pProprioLots,ploc:pProprioLoc,pincidents:pProprioIncidents,pplanning:pProprioPlanning,pcompta:pProprioCompta,prapports:pProprioRapports,pdocs:pProprioDocs,...communs}}
    else if(S.espace==='loc'){chromeFn=chromeLoc;defaut='lbail';
      pages={lbail:pLocBail,lloyer:pLocLoyer,lincidents:pLocIncidents,lplanning:pLocPlanning,ldocs:pLocDocs,ldeclarer:pLocDeclarer,...communs}}
    else if(S.espace==='artisan'){chromeFn=chromeArtisan;defaut='ademandes';
      pages={ademandes:pArtDemandes,aplanning:pArtPlanning,areglements:pArtReglements,aprofil:pArtProfil,ainterventions:pArtInterventions,aconformite:pArtConformite,adevis:pArtDevis,...communs}}
    else if(S.espace==='admin'){chromeFn=chromeAdmin;defaut='sabord';
      pages={sabord:pSaBord,saespaces:pSaEspaces,samodeles:pSaModeles,saarticles:pSaArticles,saregles:pSaRegles,...communs}}
    else pages={bord:pageBord,parc:pageParc,personnes:pagePersonnes,compta:pageCompta,docs:pageDocs,alertes:pageAlertes,
      bien:pageBien,personne:pagePersonne,bail:pageBail,rapport:pageRapport,restitution:pageRestitution,intervention:pageInterventions,
      admin:pageAdmin,planning:pagePlanning,messages:pageMessages,incidents:pageIncidents,incident:pageIncident,completer:pageCompleter,impayes:pageImpayes,impaye:pageImpaye,
      mandat:pageMandat,edl:pageEDL,regul:pageRegul,document:pageDocument,reglages:pageReglages,reprise:pageReprise,interv:pageInterventionDetail,...communs};
    html=chromeFn((pages[pg]||pages[defaut])(arg));
    if(S.panneau)html+=panneauLot();
    if(S.modale)html+=(S.modale.startsWith('fil-')?modaleFil():modaleAlerte());
    if(S.bot)html+=modaleBot();
    if(S.confirm)html+=modaleConfirm();
    if(S.recherche&&S.espace==='agence')html+=overlayRecherche();
  }
  if(S.toast)html+=`<div class="toast">◇ <span style="flex:1">${S.toast}</span><button onclick="S.toast=null;rendre()" style="color:rgba(245,239,227,.7);font-size:16px;padding:0 2px" aria-label="Fermer">×</button></div>`;
  $('#app').innerHTML=html;
  animerChiffres();
}
function animerChiffres(){
  document.querySelectorAll('.chiffre').forEach(el=>{
    if(el.dataset.anime)return;el.dataset.anime='1';
    const txt=el.textContent, m=txt.match(/([\d\s\u202f\u00a0]+)(,\d+)?/);
    if(!m)return;
    const cible=parseInt(m[1].replace(/[\s\u202f\u00a0]/g,''),10);
    if(isNaN(cible)||cible===0)return;
    const avant=txt.slice(0,m.index), apres=txt.slice(m.index+m[0].length), dec=m[2]||'';
    const debut=performance.now(), duree=520;
    (function pas(t){
      const p=Math.min(1,(t-debut)/duree), e=1-Math.pow(1-p,3);
      el.textContent=avant+Math.round(cible*e).toLocaleString('fr-FR')+(p===1?dec:'')+apres;
      if(p<1)requestAnimationFrame(pas)})(debut);
  });
}
function celebrer(){
  const c=['#14304F','#2F6FB0','#B08D3E','#C0392B','#E8EEF4'];
  for(let i=0;i<26;i++){const d=document.createElement('span');d.className='confetti';
    d.style.left=(42+Math.random()*16)+'vw';d.style.background=c[i%5];
    d.style.animationDuration=(0.8+Math.random()*0.7)+'s';d.style.animationDelay=(Math.random()*0.15)+'s';
    if(i%3)d.style.borderRadius='50%';
    document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
}
function tempsRelatif(h){return h<1?'à l’instant':h<24?`il y a ${h} h`:h<48?'hier':`il y a ${Math.round(h/24)} j`}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(S.panneau||S.modale||S.recherche||S.menu)){S.panneau=null;S.modale=null;S.recherche=false;S.menu=false;rendre()}
  if((e.key==='k'||e.key==='K')&&(e.metaKey||e.ctrlKey)&&S.ecran==='app'&&S.espace==='agence'){
    e.preventDefault();S.recherche=true;rendre();setTimeout(()=>{const c=document.getElementById('champRech');if(c)c.focus()},30)}
});
rendre();

</script>
