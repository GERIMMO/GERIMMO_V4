<style>
:root{

  --fond:#F4F1EB; --carte:#FFFFFF; --texte:#1E2C3C; --t2:#6B7686; --t3:#9AA4B1; --filet:#E9E4D8;
  --bleu:#2F6FB0; --vert:#2E7D4F; --vert-pale:#E7F2EB; --rouge:#C0392B; --rouge-pale:#F9E9E6;
  --ambre:#B07818; --ambre-pale:#F7EFDD; --bleu-pale:#E8F0F8;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:14px; --ombre:0 1px 3px rgba(18,42,68,.06),0 6px 18px rgba(18,42,68,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--fond);color:var(--texte);font-size:14.5px;line-height:1.55}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
a{color:var(--bleu);text-decoration:none}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

.late{background:linear-gradient(180deg,var(--encre) 0%,var(--encre-2) 100%);color:#EDE9DF;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo .nom{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.16em}
.logo .sous-nom{font-size:8.5px;letter-spacing:.22em;color:var(--or);margin-top:1px}
.menu{padding:14px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.menu button{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:rgba(237,233,223,.78);font-size:13.5px;text-align:left;position:relative;transition:background .15s,color .15s}
.menu button:hover{background:rgba(255,255,255,.06)}
.menu button.actif{background:linear-gradient(90deg,var(--or-fonce),var(--or));color:#132B45;font-weight:600}
.menu button.actif svg{stroke:#132B45}
.menu svg{width:17px;height:17px;stroke:rgba(237,233,223,.75);fill:none;stroke-width:1.7;flex:none}
.badge{margin-left:auto;background:var(--rouge);color:#fff;font-size:10.5px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.late-bas{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:rgba(237,233,223,.45)}
.aide-bot{display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:10px 12px;margin-bottom:12px;color:rgba(237,233,223,.85);font-size:12.5px;width:100%}

/* ---- haut ---- */
.haut{background:var(--carte);border-bottom:1px solid var(--filet);display:flex;align-items:center;gap:16px;padding:11px 26px;position:sticky;top:0;z-index:20}
.cherche{flex:1;max-width:320px;display:flex;align-items:center;gap:9px;background:var(--fond);border-radius:10px;padding:9px 14px;color:var(--t3);font-size:13.5px}
.rondh{position:relative;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fond)}
.rondh svg{width:17px;height:17px;stroke-width:1.7;flex:none}
.cherche svg{width:16px;height:16px;stroke-width:1.7;flex:none;stroke:var(--t3)}
.aide-bot svg,.b svg{width:15px;height:15px;stroke-width:1.8;flex:none}
.rondh .pt{position:absolute;top:-3px;right:-3px;background:var(--rouge);color:#fff;font-size:10px;font-weight:600;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.moi{display:flex;align-items:center;gap:10px;margin-left:6px}
.avat{width:36px;height:36px;border-radius:50%;background:var(--encre);color:var(--or);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600}
.moi .l1{font-size:13.5px;font-weight:600;line-height:1.2}
.moi .l2{font-size:11.5px;color:var(--t2)}

/* ---- contenu ---- */
.corps{padding:26px 30px 60px}
.grille{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.date-l{font-size:12.5px;color:var(--t2);letter-spacing:.02em}
h1{font-family:var(--serif);font-weight:600;font-size:37px;color:var(--encre);line-height:1.1;margin-top:4px}
.st{color:var(--t2);margin-top:5px}
.carte{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:20px;margin-top:16px}
.carte h2{font-size:16px;font-weight:600;color:var(--encre)}
.tete{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.lien{font-size:13px;color:var(--bleu);font-weight:500;white-space:nowrap}
.puce-ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.puce-ic svg{width:20px;height:20px;fill:none;stroke-width:1.8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.kpi{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:18px}
.kpi .v{font-family:var(--serif);font-weight:600;font-size:29px;color:var(--encre);margin-top:8px}
.kpi .t{font-size:13px;font-weight:600;color:var(--encre)}
.kpi .s{font-size:12.5px;color:var(--t2);margin-top:2px}
.kpi .pied{font-size:13px;color:var(--bleu);font-weight:500;margin-top:12px;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.tg-vert{background:var(--vert-pale);color:var(--vert)} .tg-ambre{background:var(--ambre-pale);color:var(--ambre)}
.tg-rouge{background:var(--rouge-pale);color:var(--rouge)} .tg-bleu{background:var(--bleu-pale);color:var(--bleu)}
.jauge{height:7px;background:var(--filet);border-radius:4px;overflow:hidden;margin:9px 0 5px}
.jauge i{display:block;height:100%;background:var(--vert);border-radius:4px}
.rang{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--filet)}
.rang:last-of-type{border-bottom:none}
.rang .t{font-size:14px;font-weight:600;color:var(--encre)}
.rang .s{font-size:12.5px;color:var(--t2);margin-top:1px}
.rond-p{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;transition:opacity .15s}
.b:active{opacity:.7}
.b-encre{background:var(--encre);color:#F2EDE1}
.b-or{background:linear-gradient(90deg,var(--or-fonce),var(--or));color:#132B45}
.b-blanc{border:1px solid var(--filet);background:var(--carte);color:var(--encre)}
.b-pl{width:100%}
.champ{width:100%;border:1px solid var(--filet);border-radius:10px;padding:11px 13px;font:inherit;font-size:14px;background:var(--carte);margin:5px 0 13px}
.champ:focus{outline:2px solid var(--or);border-color:var(--or)}
label{font-size:12.5px;color:var(--t2);font-weight:500}

.hero{border-radius:var(--r);background:linear-gradient(100deg,#FFFFFF 0%,#FFFFFF 52%,rgba(255,255,255,.55) 66%,rgba(255,255,255,0) 82%),url('https://picsum.photos/seed/salon22/1100/380') right center/cover no-repeat,linear-gradient(115deg,#D8CCB4,#C9BCA0);box-shadow:var(--ombre);padding:22px;display:flex;align-items:center;gap:18px;margin-top:18px}
.citation{margin-left:auto;font-family:var(--serif);font-style:italic;font-weight:500;font-size:18.5px;color:var(--encre);max-width:210px;text-align:right;line-height:1.35}
.citation::after{content:'';display:block;width:44px;height:2px;background:var(--or);margin:10px 0 0 auto}
.etapes{margin-top:8px}
.etape{display:flex;gap:11px;padding:6px 0;font-size:13.5px}
.etape .pt2{width:9px;height:9px;border-radius:50%;background:var(--filet);margin-top:5px;flex:none}
.etape.f .pt2{background:var(--or)} .etape:not(.f){color:var(--t3)}
.msgb{max-width:88%;padding:10px 14px;border-radius:13px;font-size:13.5px;margin-top:10px;line-height:1.5;background:var(--fond)}
.msgb.moi2{background:var(--encre);color:#F2EDE1;margin-left:auto;border-bottom-right-radius:4px}
.msgb .q{font-size:11px;color:var(--t3);margin-bottom:2px}
.msgb.moi2 .q{color:rgba(242,237,225,.6)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--encre);color:#F2EDE1;padding:12px 20px;border-radius:11px;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 32px rgba(18,42,68,.4);z-index:60;max-width:92vw}
.toast .o{color:var(--or)}
.bandeau-bas{border-radius:var(--r);background:linear-gradient(100deg,#EFE9DB,#E4DBC6);padding:24px;margin-top:20px}
.bandeau-bas b{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--encre);display:block}
.urg{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--t2)}
.urg .n{color:var(--rouge);font-weight:700;font-size:17px}
.corps > .page{animation:fondu .3s ease}
@keyframes fondu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:1060px){.grille{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.app{grid-template-columns:64px 1fr}.logo .nom,.logo .sous-nom,.menu .lib,.late-bas,.aide-bot span{display:none}.menu button{justify-content:center;padding:12px}.badge{position:absolute;top:4px;right:4px;margin:0}.moi .l1,.moi .l2{display:none}.kpis{grid-template-columns:1fr}.corps{padding:18px 14px 50px}h1{font-size:30px}.hero{display:none}}
@media (prefers-reduced-motion:reduce){.corps > .page{animation:none}}
.depl{position:absolute;top:56px;right:0;width:330px;background:var(--carte);border-radius:12px;box-shadow:0 14px 40px rgba(18,42,68,.18);padding:14px;z-index:40}
.depl .rang{padding:10px 0}
.sugg{position:absolute;top:56px;left:0;width:100%;max-width:520px;background:var(--carte);border-radius:12px;box-shadow:0 14px 40px rgba(18,42,68,.18);padding:8px;z-index:40}

.sugg button:hover{background:var(--fond)}
.pts{display:flex;gap:5px;margin-top:10px}
.pts i{width:14px;height:14px;border-radius:50%;background:var(--vert-pale);border:1.5px solid var(--vert);position:relative}
.pts i.v{background:var(--vert)}
.pts i.a{background:transparent;border-color:var(--or-fonce)}
.chip{border:1px solid var(--filet);border-radius:999px;padding:7px 13px;font-size:12.5px;color:var(--encre);background:var(--fond)}
.chip:active{opacity:.7}
@keyframes surgir{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.carte,.kpi{animation:surgir .38s ease both}
.carte:nth-of-type(2),.kpi:nth-child(2){animation-delay:.06s}
.carte:nth-of-type(3),.kpi:nth-child(3){animation-delay:.12s}
.carte:nth-of-type(4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){.carte,.kpi{animation:none}}
</style>
</head>

/* ---------- chiffres animés ---------- */
function animerChiffres(){
  document.querySelectorAll('.vnum').forEach(el=>{
    if(el.dataset.anime)return;el.dataset.anime='1';
    const txt=el.textContent, m=txt.match(/([\d\s\u202f\u00a0]+)(,\d+)?/);
    if(!m)return;
    const cible=parseInt(m[1].replace(/[\s\u202f\u00a0]/g,''),10);
    if(isNaN(cible)||cible===0)return;
    const avant=txt.slice(0,m.index), apres=txt.slice(m.index+m[0].length), dec=m[2]||'';
    const debut=performance.now(), duree=520;
    (function pas(t){
      const p=Math.min(1,(t-debut)/duree), e=1-Math.pow(1-p,3);
      el.textContent=avant+Math.round(cible*e).toLocaleString('fr-FR')+(p===1?dec:'')+apres;
      if(p<1)requestAnimationFrame(pas)})(debut);
  });
}
